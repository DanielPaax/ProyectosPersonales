.mk-modalP .mk-izq{border-right:none}
@media (max-width:900px){ .mk-mb{grid-template-columns:1fr} .mk-izq{border-right:none; border-bottom:1px solid var(--linea)} .mk-tablero,.mk-cal,.mk-barra{padding-left:12px; padding-right:12px} .mk-dia{min-height:76px} .mk-ev{font-size:10px; padding:1px 3px} }
</style>

<script>
var MK = { d: null, vista: 'tablero', mes: null, cur: null, tab: 'c', det: null, sel: [] };
var MK_COL = { 'BRIEF': '#8A5CF6', 'PLANEACIÓN': '#2D7FF9', 'PRODUCCIÓN': '#F0A80C', 'EJECUCIÓN': '#FF6A13', 'FINALIZADO': '#1E8E5A' };

function mkApi(accion, datos){
  var intento = 0;
  return new Promise(function(res, rej){
    (function ir(){
      google.script.run
        .withSuccessHandler(res)
        .withFailureHandler(function(err){
          if (esSesionPerdida(err)) { sesionPerdida(); return rej(err); }
          if (/candado|lock/i.test(String(err && err.message)) && intento++ < 2) { return setTimeout(ir, 1200); }
          rej(err);
        })
        .mktApi(accion, JSON.stringify(datos || {}), CLAVE);
    })();
  });
}
function mkE(s){ return esc(s == null ? '' : s); }
function mkMsg(m){ ptToast(m); }
function mkErr(e){ ptToast((e && e.message) ? e.message.replace(/^Error:\s*/, '') : 'No se pudo completar.'); }
function mkIso(d){ var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (x < 10 ? '0' : '') + x; }
function mkHoy(){ return mkIso(new Date()); }
function mkFmt(f){ if (!f) { return ''; } if (!/^\d{4}-\d{2}-\d{2}/.test(String(f))) { return String(f); } var p = String(f).slice(0, 10).split('-'); var M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return p[2] + ' ' + M[+p[1] - 1] + (String(f).length > 10 ? ' ' + String(f).slice(11, 16) : ''); }
function mkNombre(c){ var e = MK.d.equipo.filter(function(x){ return x.correo === c; })[0]; return e ? e.nombre : c; }
function mkIni(c){ var n = mkNombre(c).split(' '); return ((n[0] || '?')[0] + (n[1] ? n[1][0] : '')).toUpperCase(); }
function mkPuedeEditar(t){
  var n = MK.d.nivel; if (n >= 3) { return true; } if (n < 2) { return false; }
  return t.creadoPor === MK.d.yo || t.responsables.indexOf(MK.d.yo) >= 0;
}

function abrirMkt(){
  document.getElementById('appPortal').className = 'oculto';
  document.getElementById('appMkt').className = '';
  window.scrollTo(0, 0);
  var l = document.getElementById('mkLogo'); if (LOGO_BLANCO) { l.src = LOGO_BLANCO; } else { l.style.display = 'none'; }
  document.getElementById('mkTablero').innerHTML = '<div class="mk-vacio" style="grid-column:1/-1">Cargando…</div>';
  mkApi('inicio').then(function(d){
    MK.d = d;

    document.getElementById('mkQuien').innerHTML = '<b>' + mkE(d.yo) + '</b><br>' + ['', 'Solo consulta', 'Ver y escribir', 'Ver, escribir y editar'][d.nivel];

    sel.innerHTML = '<option value="todos">Todas las personas</option><option value="mias">Mis actividades</option>' +
      d.equipo.map(function(e){ return '<option value="' + mkE(e.correo) + '">' + mkE(e.nombre) + '</option>'; }).join('');
    sel.value = v;
    document.getElementById('mkEtapa').innerHTML = d.etapas.map(function(e){ return '<option>' + mkE(e) + '</option>'; }).join('');
    document.getElementById('mkPrio').innerHTML = d.prioridades.map(function(e){ return '<option>' + mkE(e) + '</option>'; }).join('');

  }).catch(function(e){ document.getElementById('mkTablero').innerHTML = '<div class="mk-vacio" style="grid-column:1/-1">' + mkE(e && e.message) + '</div>'; });
}
function mkSalir(){
  mkCierra();
  document.getElementById('appMkt').className = 'oculto';
  document.getElementById('appPortal').className = '';
  window.scrollTo(0, 0);
}
function mkVista(v){
  MK.vista = v;
  document.getElementById('mkVTab').className = v === 'tablero' ? 'on' : '';
  document.getElementById('mkVCal').className = v === 'calendario' ? 'on' : '';
  document.getElementById('mkVPro').className = v === 'prospectos' ? 'on' : '';
  mkPinta();
}
function mkFiltradas(){
  var p = document.getElementById('mkFPers').value, q = document.getElementById('mkFTxt').value.trim().toLowerCase();
  return MK.d.tareas.filter(function(t){
    if (p === 'mias' && t.responsables.indexOf(MK.d.yo) < 0 && t.creadoPor !== MK.d.yo) { return false; }
    if (p !== 'todos' && p !== 'mias' && t.responsables.indexOf(p) < 0) { return false; }
    var pp = t.prospecto ? mkPros(t.prospecto) : null;
    if (q && (t.titulo + ' ' + t.descripcion + ' ' + t.etiquetas + ' ' + (pp ? pp.nombre + ' ' + pp.empresa : '')).toLowerCase().indexOf(q) < 0) { return false; }
    return true;
  });
}
function mkPinta(){
  if (!MK.d) { return; }
  document.getElementById('mkTablero').style.display = MK.vista === 'tablero' ? '' : 'none';
  document.getElementById('mkCal').style.display = MK.vista === 'calendario' ? '' : 'none';
  document.getElementById('mkPros').style.display = MK.vista === 'prospectos' ? '' : 'none';
  document.getElementById('mkFPers').style.display = MK.vista === 'prospectos' ? 'none' : '';
  document.getElementById('mkNueva').textContent = MK.vista === 'prospectos' ? '+ Nuevo prospecto' : '+ Nueva actividad';
  if (MK.vista === 'tablero') { mkTableroPinta(); } else if (MK.vista === 'calendario') { mkCalPinta(); } else { mkProsPinta(); }
}

/* ---------- Prospectos ---------- */
function mkPros(id){ return (MK.d.prospectos || []).filter(function(x){ return x.id === id; })[0]; }
function mkProSelect(sel){
  var l = (MK.d.prospectos || []).filter(function(x){ return x.estatus !== 'Descartado' || x.id === sel; });
  document.getElementById('mkPro').innerHTML = '<option value="">— Sin prospecto (actividad libre) —</option>' +
    l.map(function(x){ return '<option value="' + x.id + '">' + mkE(x.nombre + (x.empresa ? ' · ' + x.empresa : '') + ' (' + x.estatus + ')') + '</option>'; }).join('');
  document.getElementById('mkPro').value = sel || '';
}
function mkNuevoBtn(){ if (MK.vista === 'prospectos') { mkPAbre(null); } else { mkAbre(null); } }
function mkProsPinta(){
  var el = document.getElementById('mkPros'), fte = (document.getElementById('mkPF1') || {}).value || '', est = (document.getElementById('mkPF2') || {}).value || '';
  var q = document.getElementById('mkFTxt').value.trim().toLowerCase();
  var l = MK.d.prospectos.filter(function(x){
    if (fte && x.fuente !== fte) { return false; } if (est && x.estatus !== est) { return false; }
    return !q || (x.nombre + ' ' + x.empresa + ' ' + x.correo + ' ' + x.celular + ' ' + x.solicitud).toLowerCase().indexOf(q) >= 0;
  });
  var cuenta = {}; MK.d.prospectos.forEach(function(x){ cuenta[x.estatus] = (cuenta[x.estatus] || 0) + 1; });
  var h = '<div class="mk-pfil"><b>' + l.length + ' de ' + MK.d.prospectos.length + ' prospectos</b>' +
    '<select id="mkPF1" onchange="mkProsPinta()"><option value="">Todas las fuentes</option>' + MK.d.fuentes.map(function(f){ return '<option' + (f === fte ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select>' +
    '<select id="mkPF2" onchange="mkProsPinta()"><option value="">Todos los estatus</option>' + ['Nuevo','Contactado','Cotizando','Cliente','Descartado'].map(function(f){ return '<option' + (f === est ? ' selected' : '') + ' value="' + f + '">' + f + (cuenta[f] ? ' (' + cuenta[f] + ')' : '') + '</option>'; }).join('') + '</select></div>' +
    '<div style="overflow-x:auto"><table class="mk-tabla"><thead><tr><th>Fecha y hora</th><th>Capturó</th><th>Contacto</th><th>Empresa</th><th>Fuente</th><th>Celular</th><th>Correo</th><th>Solicitud</th><th>Estatus</th><th>Tareas</th><th></th></tr></thead><tbody>';
  if (!l.length) { h += '<tr><td colspan="11" class="mk-vacio">Sin prospectos. Usa «+ Nuevo prospecto».</td></tr>'; }
  l.forEach(function(x){
    var edita = MK.d.nivel >= 3 || (MK.d.nivel >= 2 && x.usuario === MK.d.yo);
    h += '<tr><td>' + mkE(mkFmt(x.fecha)) + '<br><small>' + mkE(x.hora) + ' h</small></td><td>' + mkE(mkNombre(x.usuario)) + '</td><td><b>' + mkE(x.nombre) + '</b></td><td>' + mkE(x.empresa) + '</td>' +
      '<td><span class="mk-fte">' + mkE(x.fuente) + '</span></td><td>' + mkE(x.celular) + '</td><td>' + mkE(x.correo) + '</td><td class="sol">' + mkE(x.solicitud.length > 180 ? x.solicitud.slice(0, 180) + '…' : x.solicitud) + '</td>' +
      '<td><span class="mk-est ' + x.estatus + '">' + x.estatus + '</span>' + (x.clienteId ? '<br><small>ERP ' + mkE(x.clienteId) + '</small>' : '') + '</td><td>' + (x.tareas || '') + '</td>' +
      '<td><div class="acc"><button type="button" class="mk-btn sec chico" onclick="mkPAbre(\'' + x.id + '\')">' + (edita ? 'Editar' : 'Ver') + '</button>' +
      (MK.d.nivel >= 2 ? '<button type="button" class="mk-btn sec chico" onclick="mkPTareaDe(\'' + x.id + '\')">+ Tarea</button>' : '') +
      (MK.d.nivel >= 2 && !x.clienteId ? '<button type="button" class="mk-btn chico" title="Crea el cliente en el ERP para poder cotizarle" onclick="mkPConvierte(\'' + x.id + '\')">Crear cliente ERP</button>' : '') +
      (edita ? '<button type="button" class="mk-btn rojo chico" onclick="mkPBorra(\'' + x.id + '\')">×</button>' : '') + '</div></td></tr>';
  });
  el.innerHTML = h + '</tbody></table></div>';
}
function mkPAbre(id){
  var x = id ? mkPros(id) : null; if (!x && MK.d.nivel < 2) { return; }
  MK.pcur = x;
  var ed = !x || MK.d.nivel >= 3 || (MK.d.nivel >= 2 && x.usuario === MK.d.yo);
  document.getElementById('mkPTit').textContent = x ? 'Prospecto ' + x.id : 'Nuevo prospecto';
  document.getElementById('mkPFte').innerHTML = '<option value="">Elige…</option>' + MK.d.fuentes.map(function(f){ return '<option>' + f + '</option>'; }).join('');
  document.getElementById('mkPEst').innerHTML = ['Nuevo','Contactado','Descartado'].map(function(f){ return '<option>' + f + '</option>'; }).join('');
  document.getElementById('mkPNom').value = x ? x.nombre : ''; document.getElementById('mkPEmp').value = x ? x.empresa : '';
  document.getElementById('mkPFte').value = x ? x.fuente : ''; document.getElementById('mkPCel').value = x ? x.celular : '';
  document.getElementById('mkPCor').value = x ? x.correo : ''; document.getElementById('mkPSol').value = x ? x.solicitud : '';
  var auto = x && (x.estatus === 'Cotizando' || x.estatus === 'Cliente');
  document.getElementById('mkPEst').value = x && !auto ? x.estatus : 'Nuevo';
  document.getElementById('mkPEst').disabled = !ed || !x || auto;
  ['mkPNom','mkPEmp','mkPFte','mkPCel','mkPCor','mkPSol'].forEach(function(k){ document.getElementById(k).disabled = !ed; });
  document.getElementById('mkPGuarda').style.display = ed ? '' : 'none';
  document.getElementById('mkPTarea').style.display = x && MK.d.nivel >= 2 ? '' : 'none';
  document.getElementById('mkPInfo').innerHTML = x ? 'Capturado el ' + mkE(mkFmt(x.fecha)) + ' a las ' + mkE(x.hora) + ' h por <b>' + mkE(mkNombre(x.usuario)) + '</b> (' + mkE(x.usuario) + ').' +
    (auto ? '<br>Estatus <b>' + x.estatus + '</b>: lo calcula el ERP según sus cotizaciones y ODP.' : '') : 'La fecha, la hora y tu usuario se guardan solos al capturar.';
  var ts = x ? MK.d.tareas.filter(function(t){ return t.prospecto === x.id; }) : [];
  document.getElementById('mkPTar').innerHTML = ts.length ? '<b>Tareas ligadas:</b> ' + ts.map(function(t){ return '<a href="#" style="color:var(--azul)" onclick="mkPCierra();mkAbre(\'' + t.id + '\');return false">' + mkE(t.titulo) + ' (' + mkE(t.etapa) + ')</a>'; }).join(' · ') : '';
  document.getElementById('mkVeloP').className = 'mk-velo';
}
function mkPCierra(){ document.getElementById('mkVeloP').className = 'mk-velo oculto'; MK.pcur = null; }
function mkPGuarda(){
  var b = document.getElementById('mkPGuarda'); b.disabled = true;
  var d = { id: MK.pcur ? MK.pcur.id : '', nombre: document.getElementById('mkPNom').value, empresa: document.getElementById('mkPEmp').value, fuente: document.getElementById('mkPFte').value,
            celular: document.getElementById('mkPCel').value, correo: document.getElementById('mkPCor').value, solicitud: document.getElementById('mkPSol').value, estatus: document.getElementById('mkPEst').value };
  mkApi('guardarProspecto', d).then(function(r){
    b.disabled = false; MK.d.prospectos = r.prospectos; mkPCierra(); mkMsg(d.id ? 'Prospecto actualizado.' : 'Prospecto guardado.'); mkPinta();
  }).catch(function(e){ b.disabled = false; mkErr(e); });
}
function mkPBorra(id){
  var x = mkPros(id);
  if (!confirm('¿Eliminar el prospecto «' + x.nombre + '»? Las tareas ligadas se conservan, solo pierden la relación.')) { return; }
  mkApi('eliminarProspecto', { id: id }).then(function(r){
    MK.d.prospectos = r.prospectos; MK.d.tareas.forEach(function(t){ if (t.prospecto === id) { t.prospecto = ''; } }); mkPinta(); mkMsg('Prospecto eliminado.');
  }).catch(mkErr);
}
function mkPConvierte(id){
  var x = mkPros(id);
  if (!confirm('¿Crear (o ligar) el cliente «' + (x.empresa || x.nombre) + '» en el ERP para poder cotizarle?')) { return; }
  mkApi('convertirProspecto', { id: id }).then(function(r){ MK.d.prospectos = r.prospectos; mkPinta(); mkMsg(r.mensaje || 'Listo.'); }).catch(mkErr);
}
function mkPTareaDe(id){ MK.preP = id; mkVista('tablero'); mkAbre(null); }
function mkPNuevaTarea(){ if (MK.pcur) { var id = MK.pcur.id; mkPCierra(); mkPTareaDe(id); } }

/* ---------- Tablero ---------- */
function mkTarjeta(t, i){
  var venc = t.fin && t.fin < mkHoy() && t.etapa !== 'FINALIZADO';
  var av = t.responsables.slice(0, 4).map(function(c){ return '<span class="mk-av" title="' + mkE(mkNombre(c)) + '">' + mkE(mkIni(c)) + '</span>'; }).join('');
  var fl = '';
  if (mkPuedeEditar(t)) {
    fl = '<span class="mk-flechas">' + (i > 0 ? '<button type="button" title="Etapa anterior" onclick="event.stopPropagation();mkMueve(\'' + t.id + '\',-1)">‹</button>' : '') +
      (i < MK.d.etapas.length - 1 ? '<button type="button" title="Siguiente etapa" onclick="event.stopPropagation();mkMueve(\'' + t.id + '\',1)">›</button>' : '') + '</span>';
  }
  return '<div class="mk-card" style="--c:' + MK_COL[t.etapa] + '" draggable="' + (mkPuedeEditar(t) ? 'true' : 'false') + '" data-id="' + t.id + '" onclick="mkAbre(\'' + t.id + '\')"' +
    ' ondragstart="mkArrastra(event,\'' + t.id + '\')" ondragend="this.classList.remove(\'arr\')">' +
    '<div class="tt">' + mkE(t.titulo) + '</div>' +
    '<div class="mt"><span class="mk-pill ' + mkE(t.prioridad) + '">' + mkE(t.prioridad) + '</span>' +
    (t.fin ? '<span class="' + (venc ? 'mk-venc' : '') + '">' + (venc ? '⚠ ' : '') + mkFmt(t.fin) + '</span>' : '') +
    (t.etiquetas ? '<span>#' + mkE(t.etiquetas) + '</span>' : '') + '</div>' +
    (t.prospecto && mkPros(t.prospecto) ? '<div style="margin-top:6px"><span class="mk-chipP" title="Prospecto">👤 ' + mkE(mkPros(t.prospecto).nombre + (mkPros(t.prospecto).empresa ? ' · ' + mkPros(t.prospecto).empresa : '')) + '</span></div>' : '') +
    '<div class="ft"><span>' + av + (t.responsables.length > 4 ? ' <small>+' + (t.responsables.length - 4) + '</small>' : '') +
    '</span><span class="mt">' + (t.comentarios ? '💬 ' + t.comentarios + ' ' : '') + (t.archivos ? '📎 ' + t.archivos : '') + '</span>' + fl + '</div></div>';
}
function mkTableroPinta(){
  var fil = mkFiltradas(), h = '';
  MK.d.etapas.forEach(function(et, i){
    var ts = fil.filter(function(t){ return t.etapa === et; });
    ts.sort(function(a, b){ return (a.fin || '9999') < (b.fin || '9999') ? -1 : (a.fin || '9999') > (b.fin || '9999') ? 1 : (a.creadoEn < b.creadoEn ? -1 : 1); });
    h += '<div class="mk-col" data-etapa="' + mkE(et) + '" ondragover="mkSobre(event,this)" ondragleave="this.classList.remove(\'sobre\')" ondrop="mkSuelta(event,this)">' +
      '<h3 style="border-bottom:3px solid ' + MK_COL[et] + '; padding-bottom:6px">' + mkE(et) + '<span>' + ts.length + '</span></h3>' +
      (ts.length ? ts.map(function(t){ return mkTarjeta(t, i); }).join('') : '<div class="mk-vacio">Sin actividades</div>') + '</div>';
  });
  document.getElementById('mkTablero').innerHTML = h;
}
function mkArrastra(ev, id){ ev.dataTransfer.setData('text/plain', id); ev.dataTransfer.effectAllowed = 'move'; ev.currentTarget.classList.add('arr'); }
function mkSobre(ev, el){ ev.preventDefault(); el.classList.add('sobre'); }
function mkSuelta(ev, el){
  ev.preventDefault(); el.classList.remove('sobre');
  var id = ev.dataTransfer.getData('text/plain'); if (id) { mkMoverA(id, el.getAttribute('data-etapa')); }
}
function mkMueve(id, d){
  var t = mkBusca(id), i = MK.d.etapas.indexOf(t.etapa) + d;
  if (i >= 0 && i < MK.d.etapas.length) { mkMoverA(id, MK.d.etapas[i]); }
}
function mkBusca(id){ return MK.d.tareas.filter(function(t){ return t.id === id; })[0]; }
function mkMoverA(id, etapa){
  var t = mkBusca(id); if (!t || t.etapa === etapa) { return; }
  if (!mkPuedeEditar(t)) { return mkMsg('Solo quien creó la actividad, a quien se asignó o un editor puede moverla.'); }
  var antes = t.etapa; t.etapa = etapa; mkPinta();   /* optimista */
  mkApi('moverTarea', { id: id, etapa: etapa }).then(function(r){ mkReemplaza(r.tarea); mkPinta(); })
    .catch(function(e){ t.etapa = antes; mkPinta(); mkErr(e); });
}
function mkReemplaza(n){
  var a = MK.d.tareas, i;
  for (i = 0; i < a.length; i++) { if (a[i].id === n.id) { n.comentarios = n.comentarios || a[i].comentarios; n.archivos = n.archivos || a[i].archivos; a[i] = n; return; } }
  a.push(n);
}

/* ---------- Calendario (semana inicia en lunes) ---------- */
function mkMesMover(d){ MK.mes = d === 0 ? new Date(new Date().getFullYear(), new Date().getMonth(), 1) : new Date(MK.mes.getFullYear(), MK.mes.getMonth() + d, 1); mkPinta(); }
function mkCalPinta(){
  var M = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var y = MK.mes.getFullYear(), m = MK.mes.getMonth(), primero = new Date(y, m, 1), off = (primero.getDay() + 6) % 7;
  var ini = new Date(y, m, 1 - off), nSem = Math.ceil((off + new Date(y, m + 1, 0).getDate()) / 7), fil = mkFiltradas(), hoy = mkHoy();
  var h = '<div class="mk-calcab"><button type="button" class="mk-btn sec chico" onclick="mkMesMover(-1)">‹</button><h2>' + M[m] + ' ' + y + '</h2>' +
    '<button type="button" class="mk-btn sec chico" onclick="mkMesMover(1)">›</button><button type="button" class="mk-btn sec chico" onclick="mkMesMover(0)">Hoy</button></div><div class="mk-grid">';
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(function(d){ h += '<div class="mk-dsem">' + d + '</div>'; });
  for (var i = 0; i < nSem * 7; i++) {
    var d = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i), iso = mkIso(d);
    var ts = fil.filter(function(t){ var a = t.inicio || t.fin, b = t.fin || t.inicio; return a && iso >= a && iso <= b; });
    h += '<div class="mk-dia' + (d.getMonth() !== m ? ' fuera' : '') + (iso === hoy ? ' hoy' : '') + '" onclick="mkAbre(null,\'' + iso + '\')"><div class="n">' + d.getDate() + '</div>';
    ts.slice(0, 3).forEach(function(t){
      h += '<span class="mk-ev" style="--c:' + MK_COL[t.etapa] + '" title="' + mkE(t.titulo + ' · ' + t.etapa) + '" onclick="event.stopPropagation();mkAbre(\'' + t.id + '\')">' + mkE(t.titulo) + '</span>';
    });
    if (ts.length > 3) { h += '<span class="mk-mas">+' + (ts.length - 3) + ' más</span>'; }
    h += '</div>';
  }
  h += '</div>';
  var sin = fil.filter(function(t){ return !t.inicio && !t.fin; });
  if (sin.length) {
    h += '<div class="mk-sinfecha"><b>Sin fecha (no salen en el calendario):</b> ' + sin.map(function(t){ return '<a href="#" onclick="mkAbre(\'' + t.id + '\');return false" style="color:var(--azul)">' + mkE(t.titulo) + '</a>'; }).join(' · ') + '</div>';
  }
  h += '<div class="mk-sinfecha" style="display:flex;gap:14px;flex-wrap:wrap">' + MK.d.etapas.map(function(e){ return '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:' + MK_COL[e] + ';margin-right:5px"></i>' + mkE(e) + '</span>'; }).join('') + '</div>';
  document.getElementById('mkCal').innerHTML = h;
}

/* ---------- Ficha de la actividad ---------- */
function mkAbre(id, fecha){
  var t = id ? mkBusca(id) : null;
  if (!t && MK.d.nivel < 2) { return; }
  MK.cur = t; MK.det = null; MK.tab = 'c';
  var ed = t ? mkPuedeEditar(t) : true;
  document.getElementById('mkMTit').textContent = t ? 'Actividad' : 'Nueva actividad';
  document.getElementById('mkTitulo').value = t ? t.titulo : '';
  document.getElementById('mkDesc').value = t ? t.descripcion : '';
  document.getElementById('mkEtapa').value = t ? t.etapa : MK.d.etapas[0];
  document.getElementById('mkPrio').value = t ? t.prioridad : 'Media';
  document.getElementById('mkIni').value = t ? t.inicio : (fecha || '');
  document.getElementById('mkFin').value = t ? t.fin : (fecha || '');
  document.getElementById('mkEti').value = t ? t.etiquetas : '';
  mkProSelect(t ? t.prospecto : (MK.preP || ''));
  MK.preP = '';
  MK.sel = t ? t.responsables.slice() : [];
  ['mkTitulo','mkDesc','mkEtapa','mkPrio','mkIni','mkFin','mkEti','mkPro'].forEach(function(k){ document.getElementById(k).disabled = !ed; });
  mkRespPinta(ed);
  document.getElementById('mkGuardar').style.display = ed ? '' : 'none';
  document.getElementById('mkElimina').style.display = (t && (MK.d.nivel >= 3 || t.creadoPor === MK.d.yo) && MK.d.nivel >= 2) ? '' : 'none';
  document.getElementById('mkVelo').className = 'mk-velo';
  mkTab('c'); mkPanel();
  if (t) { mkCargaDetalle(); }
}
function mkRespPinta(ed){
  document.getElementById('mkResp').innerHTML = MK.d.equipo.map(function(e){
    var on = MK.sel.indexOf(e.correo) >= 0;
    return '<label class="' + (on ? 'on' : '') + '"><input type="checkbox" ' + (on ? 'checked ' : '') + (ed ? '' : 'disabled ') + 'onchange="mkTogResp(\'' + e.correo + '\',this.checked)">' + mkE(e.nombre) + '</label>';
  }).join('') || '<small>Nadie tiene acceso a Marketing todavía.</small>';
}
function mkTogResp(c, on){
  var i = MK.sel.indexOf(c);
  if (on && i < 0) { MK.sel.push(c); } if (!on && i >= 0) { MK.sel.splice(i, 1); }
  mkRespPinta(true);
}
function mkCierra(){ document.getElementById('mkVelo').className = 'mk-velo oculto'; MK.cur = null; }
function mkPanel(){
  var hay = !!MK.cur;
  document.getElementById('mkNota').style.display = hay ? 'none' : '';
  ['mkPC','mkPA','mkPH'].forEach(function(k){ document.getElementById(k).style.display = 'none'; });
  document.getElementById('mkNC').textContent = hay && MK.cur.comentarios ? '(' + MK.cur.comentarios + ')' : '';
  document.getElementById('mkNA').textContent = hay && MK.cur.archivos ? '(' + MK.cur.archivos + ')' : '';
  if (hay) { document.getElementById({ c: 'mkPC', a: 'mkPA', h: 'mkPH' }[MK.tab]).style.display = ''; }
  document.getElementById('mkRed').style.display = MK.d.nivel >= 2 ? '' : 'none';
  document.getElementById('mkSube').style.display = MK.d.nivel >= 2 ? '' : 'none';
}
function mkTab(t){
  MK.tab = t;
  ['C','A','H'].forEach(function(k){ document.getElementById('mkT' + k).className = (k.toLowerCase() === t) ? 'on' : ''; });
  mkPanel();
}
function mkCargaDetalle(){
  var id = MK.cur.id;
  document.getElementById('mkLCom').innerHTML = '<div class="mk-vacio">Cargando…</div>';
  mkApi('detalle', { id: id }).then(function(r){
    if (!MK.cur || MK.cur.id !== id) { return; }
    MK.det = r; MK.cur.comentarios = r.tarea.comentarios; MK.cur.archivos = r.tarea.archivos;
    mkDetPinta();
  }).catch(function(e){ mkErr(e); mkCierra(); });
}
function mkTextoCom(t){
  var tokens = MK.d.equipo.map(function(e){ return e.token; });
  return mkE(t).replace(/(^|[\s(\[¡¿])@([\w.\-+]+@[\w.\-]+|[\w.\-+]+)/g, function(m, pre, tok){
    var limpio = tok.replace(/[.\-]+$/, ''), ok = tokens.some(function(x){ return x.toLowerCase() === limpio.toLowerCase(); }) || MK.d.equipo.some(function(e){ return e.correo === limpio.toLowerCase(); });
    return ok ? pre + '<span class="mk-men">@' + limpio + '</span>' + tok.slice(limpio.length) : m;
  });
}
function mkDetPinta(){
  var r = MK.det; if (!r) { return; }
  var h = r.comentarios.length ? r.comentarios.map(function(c){
    var borra = (c.autor === MK.d.yo && c.tipo !== 'sistema' && MK.d.nivel >= 2) || MK.d.nivel >= 3;
    return '<div class="mk-com' + (c.tipo === 'sistema' ? ' sis' : '') + '"><div class="q"><span><b>' + mkE(mkNombre(c.autor)) + '</b> · ' + mkFmt(c.fecha) + '</span>' +
      (borra ? '<button type="button" onclick="mkBorraCom(\'' + c.id + '\')">Eliminar</button>' : '') + '</div><div class="x">' + mkTextoCom(c.texto) + '</div></div>';
  }).join('') : '<div class="mk-vacio">Aún no hay comentarios.</div>';
  var lc = document.getElementById('mkLCom'); lc.innerHTML = h; lc.scrollTop = lc.scrollHeight;
  var puedeArch = function(a){ return MK.d.nivel >= 3 || (MK.d.nivel >= 2 && a.subidoPor === MK.d.yo); };
  document.getElementById('mkLArc').innerHTML = r.archivos.length ? r.archivos.map(function(a){
    var img = /^image\/(jpeg|png)$/.test(a.mime);
    return '<div class="mk-arch"><div class="im" id="mkIm' + a.id + '">' + (img ? '…' : mkE(a.nombre.split('.').pop().toUpperCase())) + '</div>' +
      '<div class="dt"><b>' + mkE(a.nombre) + '</b><small>' + mkTam(a.tamano) + ' · ' + mkE(mkNombre(a.subidoPor)) + ' · ' + mkFmt(a.fecha) + ' · subido en ' + mkE(a.etapa) + '</small></div>' +
      '<button type="button" class="mk-btn sec chico" onclick="mkBaja(\'' + a.id + '\')">Descargar</button>' +
      (puedeArch(a) ? '<button type="button" class="mk-btn rojo chico" onclick="mkBorraArc(\'' + a.id + '\')">×</button>' : '') + '</div>';
  }).join('') : '<div class="mk-vacio">Sin archivos. Los archivos viajan con la actividad en todas las etapas.</div>';
  r.archivos.forEach(function(a){ if (/^image\/(jpeg|png)$/.test(a.mime) && a.tamano <= 1500000) { mkMini(a); } });
  document.getElementById('mkLHis').innerHTML = r.historial.slice().reverse().map(function(x){ return '<div>' + mkE(x.t) + '<small>' + mkE(mkNombre(x.p)) + ' · ' + mkFmt(x.f) + '</small></div>'; }).join('') || '<div class="mk-vacio">Sin movimientos.</div>';
  document.getElementById('mkNC').textContent = MK.cur.comentarios ? '(' + MK.cur.comentarios + ')' : '';
  document.getElementById('mkNA').textContent = MK.cur.archivos ? '(' + MK.cur.archivos + ')' : '';
}
function mkTam(b){ return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function mkMini(a){
  mkApi('archivo', { id: a.id }).then(function(r){
    var el = document.getElementById('mkIm' + a.id); if (el) { el.innerHTML = '<img alt="" src="data:' + r.mime + ';base64,' + r.b64 + '">'; }
  }).catch(function(){ /* sin miniatura */ });
}
function mkBaja(id){
  mkMsg('Preparando archivo…');
  mkApi('archivo', { id: id }).then(function(r){
    var bin = atob(r.b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { arr[i] = bin.charCodeAt(i); }
    var url = URL.createObjectURL(new Blob([arr], { type: r.mime })), a = document.createElement('a');
    a.href = url; a.download = r.nombre; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }).catch(mkErr);
}

/* ---------- Guardar / eliminar ---------- */
function mkGuardar(){
  var b = document.getElementById('mkGuardar'); b.disabled = true;
  var d = { id: MK.cur ? MK.cur.id : '', titulo: document.getElementById('mkTitulo').value, descripcion: document.getElementById('mkDesc').value,
    etapa: document.getElementById('mkEtapa').value, prioridad: document.getElementById('mkPrio').value, inicio: document.getElementById('mkIni').value,
    fin: document.getElementById('mkFin').value, prospecto: document.getElementById('mkPro').value, etiquetas: document.getElementById('mkEti').value, responsables: MK.sel,
    comentarios: MK.cur ? MK.cur.comentarios : 0, archivos: MK.cur ? MK.cur.archivos : 0 };
  mkApi('guardarTarea', d).then(function(r){
    b.disabled = false;
    var nuevo = !MK.cur; mkReemplaza(r.tarea);
    MK.cur = mkBusca(r.tarea.id);
    var av = r.avisos || {};
    mkMsg(nuevo ? 'Actividad creada.' + (av.enviados ? ' Aviso enviado a ' + av.enviados + ' persona(s).' : '') : 'Cambios guardados.' + (av.enviados ? ' Aviso enviado a ' + av.enviados + ' persona(s).' : ''));
    if (av.fallidos) { mkMsg('No se pudo enviar ' + av.fallidos + ' correo(s) (¿cuota diaria?).'); }
    document.getElementById('mkMTit').textContent = 'Actividad';
    document.getElementById('mkElimina').style.display = '';
    MK.d.prospectos.forEach(function(x){ x.tareas = MK.d.tareas.filter(function(t){ return t.prospecto === x.id; }).length; });
    mkPinta(); mkPanel(); if (nuevo) { MK.det = null; mkCargaDetalle(); mkTab('a'); }
  }).catch(function(e){ b.disabled = false; mkErr(e); });
}
function mkElimina(){
  if (!MK.cur || !confirm('¿Eliminar la actividad «' + MK.cur.titulo + '» con sus comentarios y archivos? No se puede deshacer.')) { return; }
  var id = MK.cur.id;
  mkApi('eliminarTarea', { id: id }).then(function(){
    MK.d.tareas = MK.d.tareas.filter(function(t){ return t.id !== id; });
    mkCierra(); mkPinta(); mkMsg('Actividad eliminada.');
  }).catch(mkErr);
}

/* ---------- Comentarios y @menciones ---------- */
function mkComenta(){
  var tx = document.getElementById('mkTxt'), texto = tx.value.trim(); if (!texto || !MK.cur) { return; }
  var b = document.getElementById('mkEnvia'); b.disabled = true;
  mkApi('comentar', { tarea: MK.cur.id, texto: texto }).then(function(r){
    b.disabled = false; tx.value = ''; mkSugOculta();
    if (MK.det) { MK.det.comentarios.push(r.comentario); }
    MK.cur.comentarios++; mkDetPinta(); mkPinta();
    var av = r.avisos || {};
    if (av.enviados) { mkMsg('Comentario enviado. Se avisó por correo a ' + av.enviados + ' persona(s) mencionada(s).'); }
    if (av.fallidos) { mkMsg('No se pudo enviar ' + av.fallidos + ' aviso(s) por correo.'); }
  }).catch(function(e){ b.disabled = false; mkErr(e); });
}
function mkBorraCom(id){
  if (!confirm('¿Eliminar este comentario?')) { return; }
  mkApi('eliminarComentario', { id: id }).then(function(){
    var c = MK.det.comentarios.filter(function(x){ return x.id === id; })[0];
    MK.det.comentarios = MK.det.comentarios.filter(function(x){ return x.id !== id; });
    if (c && c.tipo !== 'sistema') { MK.cur.comentarios = Math.max(0, MK.cur.comentarios - 1); }
    mkDetPinta(); mkPinta();
  }).catch(mkErr);
}
var MK_SUG = { lista: [], i: 0, ini: -1 };
function mkSugOculta(){ document.getElementById('mkSug').style.display = 'none'; MK_SUG.lista = []; }
function mkSugBusca(){
  var tx = document.getElementById('mkTxt'), pos = tx.selectionStart, antes = tx.value.slice(0, pos);
  var m = /(^|[\s(\[¡¿])@([\w.\-+]*)$/.exec(antes);
  if (!m) { return mkSugOculta(); }
  var q = m[2].toLowerCase(); MK_SUG.ini = pos - q.length - 1;
  MK_SUG.lista = MK.d.equipo.filter(function(e){ return e.token.toLowerCase().indexOf(q) === 0 || e.nombre.toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
  MK_SUG.i = 0; mkSugPinta();
}
function mkSugPinta(){
  var el = document.getElementById('mkSug');
  if (!MK_SUG.lista.length) { el.style.display = 'none'; return; }
  el.innerHTML = MK_SUG.lista.map(function(e, i){ return '<div class="' + (i === MK_SUG.i ? 'on' : '') + '" onmousedown="event.preventDefault();mkSugElige(' + i + ')">' + mkE(e.nombre) + '<small>@' + mkE(e.token) + '</small></div>'; }).join('');
  el.style.display = '';
}
function mkSugElige(i){
  var e = MK_SUG.lista[i]; if (!e) { return; }
  var tx = document.getElementById('mkTxt'), pos = tx.selectionStart;
  tx.value = tx.value.slice(0, MK_SUG.ini) + '@' + e.token + ' ' + tx.value.slice(pos);
  var np = MK_SUG.ini + e.token.length + 2; tx.focus(); tx.setSelectionRange(np, np); mkSugOculta();
}
document.addEventListener('DOMContentLoaded', function(){
  var tx = document.getElementById('mkTxt'); if (!tx) { return; }
  tx.addEventListener('input', mkSugBusca);
  tx.addEventListener('click', mkSugBusca);
  tx.addEventListener('blur', function(){ setTimeout(mkSugOculta, 150); });
  tx.addEventListener('keydown', function(ev){
    if (MK_SUG.lista.length) {
      if (ev.key === 'ArrowDown') { ev.preventDefault(); MK_SUG.i = (MK_SUG.i + 1) % MK_SUG.lista.length; mkSugPinta(); return; }
      if (ev.key === 'ArrowUp') { ev.preventDefault(); MK_SUG.i = (MK_SUG.i - 1 + MK_SUG.lista.length) % MK_SUG.lista.length; mkSugPinta(); return; }
      if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); mkSugElige(MK_SUG.i); return; }
      if (ev.key === 'Escape') { mkSugOculta(); return; }
    }
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); mkComenta(); }
  });
  var dr = document.getElementById('mkDrop');
  dr.addEventListener('dragover', function(ev){ ev.preventDefault(); dr.classList.add('sobre'); });
  dr.addEventListener('dragleave', function(){ dr.classList.remove('sobre'); });
  dr.addEventListener('drop', function(ev){ ev.preventDefault(); dr.classList.remove('sobre'); mkSubir(ev.dataTransfer.files); });
});

/* ---------- Archivos ---------- */
function mkSubir(files){
  if (!MK.cur || !files || !files.length) { return; }
  var lista = Array.prototype.slice.call(files), id = MK.cur.id, dr = document.getElementById('mkDrop'), orig = dr.innerHTML;
  (function sig(){
    var f = lista.shift();
    if (!f) { dr.innerHTML = orig; return; }
    var ext = (f.name.split('.').pop() || '').toLowerCase();
    if (MK.d.extensiones.indexOf(ext) < 0) { mkMsg(f.name + ': tipo no permitido (solo PDF, JPG, PNG y AI).'); return sig(); }
    if (f.size > 8 * 1048576) { mkMsg(f.name + ': pesa más de 8 MB.'); return sig(); }
    dr.textContent = 'Subiendo ' + f.name + '…';
    var rd = new FileReader();
    rd.onerror = function(){ mkMsg('No se pudo leer ' + f.name); sig(); };
    rd.onload = function(){
      var b64 = String(rd.result).split(',')[1] || '';
      mkApi('subirArchivo', { tarea: id, nombre: f.name, b64: b64 }).then(function(r){
        if (MK.cur && MK.cur.id === id) { if (MK.det) { MK.det.archivos.push(r.archivo); } MK.cur.archivos++; mkDetPinta(); }
        var t = mkBusca(id); if (t && (!MK.cur || MK.cur !== t)) { t.archivos++; }
        mkPinta(); sig();
      }).catch(function(e){ mkErr(e); sig(); });
    };
    rd.readAsDataURL(f);
  })();
}
function mkBorraArc(id){
  if (!confirm('¿Eliminar este archivo?')) { return; }
  mkApi('eliminarArchivo', { id: id }).then(function(){
    MK.det.archivos = MK.det.archivos.filter(function(a){ return a.id !== id; });
    MK.cur.archivos = Math.max(0, MK.cur.archivos - 1); mkDetPinta(); mkPinta();
  }).catch(mkErr);
}
</script>
