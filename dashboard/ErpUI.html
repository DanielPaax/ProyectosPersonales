<script>
/* ===================== ERP: utilidades ===================== */
var ERPUI_BUILD = 'v2026-11-05.3 · negociaciones';
var E = { init: null, lk: null, cat: {}, vista: '', cache: {}, filtro: {} };

function erp(accion, payload, intento){
  intento = intento || 0;
  return new Promise(function(res, rej){
    google.script.run
      .withSuccessHandler(function(t){
        var r; try { r = JSON.parse(t); } catch (x) { return rej(new Error('Respuesta inválida del servidor.')); }
        if (r.ok) { return res(r.data); }
        if (/No se pudo identificar/.test(r.error || '')) { sesionPerdida(); }
        /* candado ocupado: la accion NO se ejecuto, es seguro reintentar */
        if (/candado|lock/i.test(r.error || '') && intento < 2) { return setTimeout(function(){ erp(accion, payload, intento + 1).then(res, rej); }, 2500); }
        rej(new Error(r.error || 'Error'));
      })
      .withFailureHandler(function(err){ if (esSesionPerdida(err)) { sesionPerdida(); } rej(err); })
      .erpApi(accion, JSON.stringify(payload || {}), CLAVE);
  });
}
function P(x){
  var p = E.init ? E.init.perms : [];
  if (!(p.indexOf('*') >= 0 || p.indexOf(x) >= 0)) { return false; }
  /* permiso de solo consulta (nivel 1): se ocultan las acciones que crean o modifican; el servidor lo valida igual */
  if (E.init && E.init.user.nivel < 2 && !/_ver$|^dash$|^reportes$|^fin$/.test(x)) { return false; }
  return true;
}
function PA(l){ return l.some(P); }
function $m(n){ n = Number(n) || 0; return (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function $n(n, d){ n = Number(n) || 0; return n.toLocaleString('es-MX', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }); }
function $p(n){ return ((Number(n) || 0) * 100).toFixed(1) + '%'; }
function fFecha(s){ s = String(s || ''); var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1].slice(2) : s; }
function hoyIso(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function eq(id){ return document.getElementById(id); }
function eOpts(lista, sel, vacio){
  return (vacio === false ? '' : '<option value="">' + esc(vacio || '—') + '</option>') +
    lista.map(function(x){ var v = typeof x === 'object' ? x.v : x, t = typeof x === 'object' ? x.t : x; return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
}
function ePill(txt){
  var t = String(txt || ''), c = '';
  if (/Aprobada|Pagada|Cerrada|COBRADO|Terminada/.test(t)) { c = 'ok'; }
  else if (/Rechazada|Cancelada|Vencid/.test(t)) { c = 'mal'; }
  else if (/producci|Parcial|Enviada|Negoci/.test(t)) { c = 'am'; }
  else if (/Abierta|Borrador|Pendiente|Facturada/.test(t)) { c = 'az'; }
  return '<span class="erp-pill ' + c + '">' + esc(t) + '</span>';
}
function erpError(el, e){ el.innerHTML = '<div class="erp-err"><b>No se pudo completar.</b> ' + esc(e && e.message ? e.message : String(e)) + '</div>'; }

/* ventana modal; devuelve {el, cerrar} */
function ventana(titulo, cuerpo, pie, ancha){
  var v = document.createElement('div'); v.className = 'erp-vel';
  v.innerHTML = '<div class="erp-ven' + (ancha ? ' ancha' : '') + '" role="dialog" aria-modal="true"><header><h3>' + titulo + '</h3><button type="button" aria-label="Cerrar">×</button></header>' +
    '<div class="cuerpo">' + cuerpo + '</div><footer>' + (pie || '') + '</footer></div>';
  document.body.appendChild(v);
  var o = { el: v, cerrar: function(){ if (v.parentNode) { v.parentNode.removeChild(v); } } };
  v.querySelector('header button').onclick = o.cerrar;
  /* no se cierra con clic afuera: solo con la X o los botones */
  return o;
}
function leer(el){
  var o = {};
  el.querySelectorAll('[data-k]').forEach(function(i){ o[i.getAttribute('data-k')] = i.value; });
  return o;

    (extra && extra.step ? ' step="' + extra.step + '"' : '') + (extra && extra.ph ? ' placeholder="' + esc(extra.ph) + '"' : '') + '></div>';

function eGuardar(btn, fn){
  btn.disabled = true; var t = btn.textContent; btn.textContent = 'Guardando…';
  return fn().then(function(r){ btn.disabled = false; btn.textContent = t; return r; },
    function(e){ btn.disabled = false; btn.textContent = t; ptToast(e && e.message ? e.message : 'No se pudo guardar.'); throw e; });
}
function descargaPdf(r){
  var bin = atob(r.b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) { arr[i] = bin.charCodeAt(i); }
  var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
  var a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}
function pdfBtn(accion, folio, btn){

  erp(accion, { Folio: folio }).then(function(r){ descargaPdf(r); btn.disabled = false; btn.textContent = t; },
    function(e){ btn.disabled = false; btn.textContent = t; ptToast(e.message); });

/* Partidas: cada una es un <tbody class="par"> con dos renglones (datos y opciones). Los precios, M2 y unidades los calcula el
   servidor (cotCalcular) con la tarifa de TARIFAS, la tinta, el multiplicador UV y los acabados; aqui solo se muestran. */
function tipoAcab(n){
  n = String(n || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  return n.indexOf('OJILLO') >= 0 ? 'ojillos' : n.indexOf('BASTILLA') >= 0 ? 'bastilla' : n.indexOf('BOLSA') >= 0 ? 'bolsa' : 'otro';
}
function partidaHtml(l, bloq){
  l = l || {};
  var un = E.init.cat.UNIDADES_COT || ['m2', 'mtl', 'lamina', 'pz'], imps = E.init.cat.IMPRESIONES || ['Gran Formato', 'HD', 'UV', 'Sin impresión'];
  var calc = (Number(l.Ancho) || 0) * (Number(l.Alto) || 0) * (Number(l.Cantidad) || 1);
  var man = l.M2 && Math.abs(Number(l.M2) - calc) > 0.0001 && !(l.Acabado1 || l.Acabado2 || l.Acabado3) ? '1' : '';
  var imp = l.Impresion || 'Gran Formato', uv = imp === 'UV';
  var ac = [1, 2, 3].map(function(i){
    var n = l['Acabado' + i] || '', t = tipoAcab(n);
    return '<span class="ac"><select data-c="Acabado' + i + '"><option value="">Acabado ' + i + '</option>' + (E.cat.ACABADO || []).map(function(x){ return '<option' + (x === n ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>' +
      '<input data-c="Param' + i + '" type="number" step="0.1" value="' + esc(l['Param' + i] || '') + '" style="' + (t === 'otro' || !n ? 'display:none' : '') + '" placeholder="' + (t === 'ojillos' ? 'ojillos por pieza' : t === 'bastilla' ? 'cm (5)' : 'cm') + '"></span>';
  }).join('');
  return '<tbody class="par"><tr><td><input data-c="Descripcion" list="erpMats" value="' + esc(l.Descripcion || '') + '" placeholder="Escribe para buscar el material" style="min-width:230px"></td>' +
    '<td><input data-c="Ancho" type="number" step="0.01" value="' + esc(l.Ancho || '') + '"></td><td><input data-c="Alto" type="number" step="0.01" value="' + esc(l.Alto || '') + '"></td>' +
    '<td><input data-c="M2" type="number" step="0.0001" value="' + esc(l.M2 || '') + '" data-man="' + man + '" title="Se calcula solo (ancho × alto × cantidad, con lo que sumen bastilla o bolsa); puedes corregirlo"></td>' +
    '<td><select data-c="Unidad" data-u="' + (l.Unidad ? '1' : '') + '">' + un.map(function(u){ return '<option' + (u === (l.Unidad || 'm2') ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></td>' +
    '<td><input data-c="Cantidad" type="number" step="1" value="' + esc(l.Cantidad || 1) + '"></td>' +
    '<td><input data-c="PrecioM2" type="number" step="0.01" value="' + esc(l.PrecioM2 || '') + '" data-man="' + (l.PrecioManual ? '1' : '') + '" title="Precio por la unidad elegida: (material + tinta + acabados) ÷ 0.60. Si lo cambias a mano se usa tal cual."></td>' +
    '<td><input data-c="PrecioUnit" type="number" value="' + esc(l.PrecioUnit || '') + '" readonly title="Precio por pieza: importe ÷ cantidad"></td>' +
    '<td class="n imp">' + $m(l.Importe || 0) + '</td><td>' + (bloq ? '' : '<button type="button" class="erp-btn chico rojo" onclick="this.closest(\'tbody\').remove();cotRecalc()">×</button>') + '</td></tr>' +
    '<tr class="opc"><td colspan="10"><div class="opts"><span><label>Impresión</label><select data-c="Impresion">' + eOpts(imps, imp, false) + '</select></span>' +
    '<span class="uvx" style="' + (uv ? '' : 'display:none') + '"><label><input type="checkbox" data-c="TintaBlanca"' + (l.TintaBlanca ? ' checked' : '') + '> Tinta blanca</label> <label><input type="checkbox" data-c="Barniz"' + (l.Barniz ? ' checked' : '') + '> Barniz a registro</label></span>' +
    ac + '<span class="det">' + esc(l.Detalle || '') + '</span><span class="perr"></span></div></td></tr></tbody>';
}
function leePartida(tb){
  var o = {}, g = function(c){ return tb.querySelector('[data-c=' + c + ']'); };
  ['Descripcion', 'Ancho', 'Alto', 'Cantidad', 'Impresion', 'Acabado1', 'Param1', 'Acabado2', 'Param2', 'Acabado3', 'Param3'].forEach(function(c){ o[c] = g(c).value; });
  o.TintaBlanca = g('TintaBlanca').checked ? 'SI' : ''; o.Barniz = g('Barniz').checked ? 'SI' : '';
  if (g('M2').dataset.man) { o.M2 = g('M2').value; }
  if (g('Unidad').dataset.u) { o.Unidad = g('Unidad').value; }
  if (g('PrecioM2').dataset.man) { o.PrecioM2 = g('PrecioM2').value; o.PrecioManual = 'SI'; }

}

/* ---------- comentarios, @menciones y archivos ---------- */
var NG_S = { lista: [], i: 0, ini: -1 };
function ngSugOculta(){ var e = eq('ngSug'); if (e) { e.style.display = 'none'; } NG_S.lista = []; }
function ngSugBusca(){
  var tx = eq('ngTxt'), pos = tx.selectionStart, m = /(^|[\s(\[¡¿])@([\w.\-+]*)$/.exec(tx.value.slice(0, pos));
  if (!m) { return ngSugOculta(); }
  var q = m[2].toLowerCase(); NG_S.ini = pos - q.length - 1;
  NG_S.lista = ngUsuarios().filter(function(u){ return ngTok(u).toLowerCase().indexOf(q) === 0 || u.Nombre.toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
  NG_S.i = 0; ngSugPinta();
}
function ngSugPinta(){
  var el = eq('ngSug'); if (!NG_S.lista.length) { el.style.display = 'none'; return; }
  el.innerHTML = NG_S.lista.map(function(u, i){ return '<div class="' + (i === NG_S.i ? 'on' : '') + '" onmousedown="event.preventDefault();ngSugElige(' + i + ')">' + esc(u.Nombre) + '<small>@' + esc(ngTok(u)) + '</small></div>'; }).join('');
  el.style.display = '';
}
function ngSugElige(i){
  var u = NG_S.lista[i]; if (!u) { return; }
  var tx = eq('ngTxt'), pos = tx.selectionStart;
  tx.value = tx.value.slice(0, NG_S.ini) + '@' + ngTok(u) + ' ' + tx.value.slice(pos);
  var np = NG_S.ini + ngTok(u).length + 2; tx.focus(); tx.setSelectionRange(np, np); ngSugOculta();
}
function ngLee(f){
  return new Promise(function(res, rej){
    if (f.size > 8 * 1048576) { return rej(new Error(f.name + ': pesa más de 8 MB.')); }
    var rd = new FileReader(); rd.onerror = function(){ rej(new Error('No se pudo leer ' + f.name)); };
    rd.onload = function(){ res({ nombre: f.name, mime: f.type, b64: String(rd.result).split(',')[1] || '' }); };
    rd.readAsDataURL(f);
  });
}
function ngCEleg(inp){ NG.arch = inp.files[0] || null; eq('ngCNom').textContent = NG.arch ? NG.arch.name : ''; }
function ngComenta(){
  if (!NG.cur) { return; }
  var tx = eq('ngTxt'), t = tx.value.trim();
  if (!t && !NG.arch) { return; }
  var b = eq('ngEnvia'); b.disabled = true;
  (NG.arch ? ngLee(NG.arch) : Promise.resolve(null)).then(function(a){
    return erp('negComentar', { ID: NG.cur.ID, Texto: t, archivo: a });
  }).then(function(r){
    b.disabled = false; tx.value = ''; NG.arch = null; eq('ngCNom').textContent = ''; eq('ngCFile').value = ''; ngSugOculta();
    if (NG.det) { NG.det.comentarios.push(r.comentario); if (r.archivo) { NG.det.archivos.push(r.archivo); } }
    NG.cur.comentarios = (NG.cur.comentarios || 0) + 1; if (r.archivo) { NG.cur.archivos = (NG.cur.archivos || 0) + 1; }
    ngDetPinta(); ngPinta();
    if (r.mencionados) { ptToast('Comentario enviado. Se avisó a ' + r.mencionados + ' persona(s) mencionada(s).'); }
  }).catch(function(e){ b.disabled = false; ptToast(e.message); });
}
function ngSube(files){
  if (!NG.cur || !files || !files.length) { return; }
  var lista = [].slice.call(files), id = NG.cur.ID, dr = eq('ngDrop'), orig = dr.innerHTML;
  (function sig(){
    var f = lista.shift(); if (!f) { dr.innerHTML = orig; return; }
    dr.textContent = 'Subiendo ' + f.name + '…';
    ngLee(f).then(function(a){ return erp('negSubir', { ID: id, archivo: a }); }).then(function(r){
      if (NG.cur && NG.cur.ID === id) { if (NG.det) { NG.det.archivos.push(r.archivo); } NG.cur.archivos = (NG.cur.archivos || 0) + 1; ngDetPinta(); }
      ngPinta(); ptToast('Archivo subido. Se avisó por correo a diseño (' + r.avisados + ').'); sig();
    }).catch(function(e){ ptToast(e.message); sig(); });
  })();
}

  var w = ventana('Registrar cobro · ' + esc(f.FolioSAT), '<p class="erp-sub">' + esc(f.Cliente) + ' · Saldo ' + $m(f.Saldo) + '</p><div class="erp-form">' + campo('Monto', 'Monto', f.Saldo, 'number', { step: '0.01' }) + campo('Fecha', 'Fecha', hoyIso(), 'date') + campo('Referencia', 'Referencia', '', 'text', { c2: 1 }) + '</div>', '<button class="erp-btn" id="cbG">Guardar</button>');
  var b = w.el.querySelector('#cbG');
  b.onclick = function(){ var p = leer(w.el); p.FacturaID = id; eGuardar(b, function(){ return erp('registrarCobro', p); }).then(function(){ w.cerrar(); ptToast('Cobro registrado.'); vFacturas(eq('erpMain')); }, function(){}); };
}

/* ===================== CARGA DE MATERIAL (alimenta la hoja TARIFAS) ===================== */
function calcTar(p){
  var costo = Number(p.COSTO) || 0, an = Number(p.ANCHO) || 0, la = Number(p.LARGO) || 0, pres = p.PRESENTACION, cobro = p.COBRO_POR, m2p = an * la;
  var c = { m2: null, mtl: null, lamina: null, pz: null };
  if (m2p > 0) {
    c.m2 = costo / m2p;
    if (pres === 'rollo' || pres === 'bobina') { c.mtl = costo / la; }
    if (pres === 'lamina' || pres === 'hoja') { c.lamina = costo; }
    if (cobro === 'pz') { c.pz = costo; }
  } else if (cobro && cobro !== 'otro') { c[cobro] = costo; }
  return c;
}
function vCarga(m){
  erp('tarifas').then(function(rows){
    E.cache.tars = rows;
    m.innerHTML = '<h2>Carga de material</h2><p class="erp-sub">Catálogo único de materiales y costos (hoja TARIFAS). Lo que cargues aquí aparece en todos los formularios y alimenta los precios de cotización. NA = no aplica cobro por esa unidad.</p>' +
      '<div class="erp-bar"><input id="tarQ" placeholder="Buscar material o proveedor" oninput="pintaTars()" style="min-width:260px"><span class="sp"></span><button class="erp-btn nar" type="button" onclick="tarForm()">+ Nuevo material</button></div><div id="tarTabla"></div>';
    pintaTars();
  }, function(e){ erpError(m, e); });
}
function pintaTars(){
  var q = (eq('tarQ').value || '').toLowerCase(), na = function(v){ return v == null ? '<span style="color:var(--tinta-3)">NA</span>' : $m(v); };
  var rows = E.cache.tars.filter(function(t){ return !q || (t.material + ' ' + t.proveedor).toLowerCase().indexOf(q) >= 0; });
  eq('tarTabla').innerHTML = rows.length ? '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>Material</th><th>Proveedor</th><th>Presentación</th><th class="n">Ancho</th><th class="n">Largo</th><th class="n">Costo</th><th>Cobro por</th><th class="n">$/m²</th><th class="n">$/mtl</th><th class="n">$/lámina</th><th class="n">$/pz</th></tr></thead><tbody>' +
    rows.slice(0, 400).map(function(t){ return '<tr class="clic" onclick="tarForm(\'' + esc(t.material).replace(/'/g, "\\'") + '\')"><td><b>' + esc(t.material) + '</b></td><td>' + esc(t.proveedor) + '</td><td>' + esc(t.presentacion) + '</td><td class="n">' + (t.ancho || '') + '</td><td class="n">' + (t.largo || '') + '</td><td class="n">' + (t.costo ? $m(t.costo) : '') + '</td><td>' + esc(t.cobroPor) + '</td><td class="n">' + na(t.costoM2) + '</td><td class="n">' + na(t.costoMtl) + '</td><td class="n">' + na(t.costoLamina) + '</td><td class="n">' + na(t.costoPz) + '</td></tr>'; }).join('') +
    '</tbody></table></div>' + (rows.length > 400 ? '<p class="erp-sub">Mostrando 400 de ' + rows.length + '. Afina la búsqueda.</p>' : '') : '<div class="erp-vacio">Sin materiales.</div>';
}
function tarForm(nombre){
  var t = nombre ? (E.cache.tars.filter(function(x){ return x.material === nombre; })[0] || {}) : {};
  var legacy = nombre && !t.cobroPor;   // fila vieja de TARIFAS: solo tenia costo por m²
  var provs = []; E.cache.tars.forEach(function(x){ if (x.proveedor && provs.indexOf(x.proveedor) < 0) { provs.push(x.proveedor); } });
  var w = ventana(nombre ? 'Modificar material' : 'Nuevo material',
    '<datalist id="erpProvs">' + provs.map(function(x){ return '<option value="' + esc(x) + '">'; }).join('') + '</datalist><div class="erp-form">' +
    '<div class="c2"><label>Proveedor</label><input data-k="PROVEEDOR" list="erpProvs" value="' + esc(t.proveedor || '') + '"></div>' + campo('MATERIAL', 'Material', t.material, 'text', { c2: 1 }) +
    selCampo('PRESENTACION', 'Presentación', ['lamina', 'rollo', 'hoja', 'bobina', 'otro'], t.presentacion || 'otro', false) + selCampo('COBRO_POR', 'Cobro por', ['m2', 'mtl', 'lamina', 'pz', 'otro'], t.cobroPor || 'm2', false) +
    campo('ANCHO', 'Ancho (m)', t.ancho || '', 'number', { step: '0.01' }) + campo('LARGO', 'Largo (m)', t.largo || '', 'number', { step: '0.01' }) +
    campo('COSTO', 'Costo', legacy ? t.costoM2 : (t.costo || ''), 'number', { step: '0.0001' }) +
    '<div class="c2"><p class="erp-sub" style="margin:0">Con ancho y largo, el <b>costo</b> es el de la presentación (rollo, lámina…) y se calculan los costos por unidad. Sin medidas, el costo es el de la unidad de <b>cobro por</b>.' + (legacy ? ' <b>Este material solo tenía costo por m²; el costo se muestra como tal.</b>' : '') + '</p></div>' +
    '<div class="c2" id="tarPrev"></div></div>', (nombre ? '<button class="erp-btn rojo" id="tarDel" style="margin-right:auto">Eliminar material</button>' : '') + '<button class="erp-btn" id="tarG">Guardar</button>', true);
  var prev = function(){
    var p = leer(w.el), c = calcTar(p), mg = 1 / (1 - (E.init.cfg.COT_MARGEN != null ? E.init.cfg.COT_MARGEN : 0.4));
    var f = function(v){ return v ? $m(v) + ' → <b>' + $m(v * mg) + '</b>' : '<span style="color:var(--tinta-3)">NA</span>'; };
    eq('tarPrev').innerHTML = '<div class="erp-card" style="margin:0"><h3>Costo del material → precio (costo ÷ 0.60, sin tinta ni acabados)</h3>m²: ' + f(c.m2) + ' · mtl: ' + f(c.mtl) + ' · lámina: ' + f(c.lamina) + ' · pz: ' + f(c.pz) + '</div>';
  };
  w.el.addEventListener('input', prev); w.el.addEventListener('change', prev); prev();
  var del = w.el.querySelector('#tarDel');
  if (del) { del.onclick = function(){ eGuardar(del, function(){ return erp('usoTarifa', { MATERIAL: nombre }); }).then(function(r){ w.cerrar(); tarEliminar(r); }, function(){}); }; }
  var b = w.el.querySelector('#tarG');
  b.onclick = function(){
    var p = leer(w.el); if (nombre) { p.MaterialOriginal = nombre; }
    eGuardar(b, function(){ return erp('saveTarifa', p); }).then(function(r){
      var rn = r.renombrados ? r.renombrados.base + r.renombrados.ventas + r.renombrados.cotizaciones + r.renombrados.odp : 0;
      w.cerrar(); ptToast((r.avisoDashboard ? 'Material guardado. ' + r.avisoDashboard : 'Material guardado en TARIFAS.') + (rn ? ' Nombre actualizado en ' + rn + ' registros.' : ''));
      erp('catalogosProd').then(function(c){ E.cat = c; }); vCarga(eq('erpMain'));
    }, function(){});
  };
}

function tarEliminar(r){
  var u = r.uso, otros = E.cache.tars.map(function(x){ return x.material; }).filter(function(x){ return x !== r.material; });
  var usa = r.total > 0;
  var w = ventana('Eliminar material',
    '<p><b>' + esc(r.material) + '</b></p>' + (usa
      ? '<p class="erp-sub">Se usa en <b>' + r.total + '</b> registros: producción (BASE) ' + u.base + ', ventas ' + u.ventas + ', partidas de cotización ' + u.cotizaciones + ', partidas de ODP ' + u.odp + '.</p>' +
        '<datalist id="erpRepl">' + otros.map(function(x){ return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' +
        '<div class="erp-form"><div class="c2"><label>Material que lo sustituye en esos registros</label><input data-k="REEMPLAZO" list="erpRepl" placeholder="Escribe para buscar el material"></div></div>' +
        '<p class="erp-sub" style="margin-top:10px">Los registros cambian de material pero <b>conservan los precios y costos que ya tenían</b>: no se recalculan con la tarifa del material nuevo.</p>'
      : '<p class="erp-sub">Ningún registro usa este material; se elimina de TARIFAS y de todas las listas.</p>'),
    '<button class="erp-btn sec" id="tdNo">Cancelar</button><button class="erp-btn rojo" id="tdSi">Eliminar</button>');
  w.el.querySelector('#tdNo').onclick = w.cerrar;
  var b = w.el.querySelector('#tdSi');
  b.onclick = function(){
    var p = { MATERIAL: r.material }; if (usa) { p.REEMPLAZO = (w.el.querySelector('[data-k=REEMPLAZO]').value || '').trim(); if (!p.REEMPLAZO) { ptToast('Elige el material que lo sustituye.'); return; } }
    if (!confirm('¿Eliminar "' + r.material + '"' + (usa ? ' y pasar sus ' + r.total + ' registros a "' + p.REEMPLAZO + '"' : '') + '? No se puede deshacer.')) { return; }
    eGuardar(b, function(){ return erp('deleteTarifa', p); }).then(function(x){
      w.cerrar(); ptToast('Material eliminado' + (x.sustituidoPor ? ' y sustituido por ' + x.sustituidoPor : '') + '.');
      erp('catalogosProd').then(function(c){ E.cat = c; }); vCarga(eq('erpMain'));
    }, function(){});
  };
}

/* ===================== USUARIOS DEL ERP ===================== */
function vUsuarios(m){
  erp('usuarios').then(function(rows){
    E.cache.users = rows;
    m.innerHTML = '<h2>Usuarios del ERP</h2><p class="erp-sub">Quién entra al ERP y con qué rol. El rol decide qué módulos ve y qué puede hacer; los socios entran como Dirección (solo lectura).</p>' +
      '<div class="erp-bar"><span class="sp"></span><button class="erp-btn nar" type="button" onclick="usrForm()">+ Agregar usuario</button></div>' +
      '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Activo</th><th>Prefijo cot.</th></tr></thead><tbody>' +
      rows.map(function(u){ return '<tr class="clic" onclick="usrForm(\'' + esc(u.Email) + '\')"><td>' + esc(u.Email) + '</td><td>' + esc(u.Nombre) + '</td><td>' + esc(u.Rol) + '</td><td>' + esc(u.Activo) + '</td><td>' + esc(u.PrefijoCot) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="erp-card" style="margin-top:16px"><h3>Roles</h3><p class="erp-sub" style="margin:0">ADMIN: todo · COMERCIAL: sus clientes, cotizaciones y ODP · PRODUCCION: ODP, producción y consumo · ALMACEN: inventario y compras · FINANZAS: facturas, cobros, compras y costos · DIRECCION: consulta total · CONSULTA: consulta sin costos.</p></div>';
  }, function(e){ erpError(m, e); });
}
function usrForm(email){
  var u = email ? E.cache.users.filter(function(x){ return x.Email === email; })[0] : {};
  var w = ventana(email ? 'Usuario' : 'Agregar usuario', '<div class="erp-form">' + campo('Email', 'Correo', u.Email, 'email', { c2: 1 }) + campo('Nombre', 'Nombre', u.Nombre) + selCampo('Rol', 'Rol', E.init.cat.ROLES, u.Rol || 'COMERCIAL', false) +
    selCampo('Activo', 'Activo', ['SI', 'NO'], u.Activo || 'SI', false) + campo('PrefijoCot', 'Prefijo de cotización (ej. CP)', u.PrefijoCot) + '</div>', '<button class="erp-btn" id="usG">Guardar</button>');
  if (email) { w.el.querySelector('[data-k=Email]').disabled = true; }
  var b = w.el.querySelector('#usG');
  b.onclick = function(){ var p = leer(w.el); if (email) { p.Email = email; } eGuardar(b, function(){ return erp('saveUsuario', p); }).then(function(){ w.cerrar(); ptToast('Usuario guardado.'); vUsuarios(eq('erpMain')); }, function(){}); };
}
</script>
