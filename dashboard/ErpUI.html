function eOpts(lista, sel, vacio){
  return (vacio === false ? '' : '<option value="">' + esc(vacio || '—') + '</option>') +
    lista.map(function(x){ var v = typeof x === 'object' ? x.v : x, t = typeof x === 'object' ? x.t : x; return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
}
function ePill(txt){
  var t = String(txt || ''), c = '';
  if (/Aprobada|Pagada|Cerrada|COBRADO|Terminada/.test(t)) { c = 'ok'; }
  else if (/Rechazada|Cancelada|Vencid/.test(t)) { c = 'mal'; }
  else if (/producci|Parcial|Enviada|Negoci/.test(t)) { c = 'am'; }
  else if (/Abierta|Borrador|Pendiente|Facturada/.test(t)) { c = 'az'; }
  return '<span class="erp-pill ' + c + '">' + esc(t) + '</span>';
}
function erpError(el, e){ el.innerHTML = '<div class="erp-err"><b>No se pudo completar.</b> ' + esc(e && e.message ? e.message : String(e)) + '</div>'; }

/* ventana modal; devuelve {el, cerrar} */
function ventana(titulo, cuerpo, pie, ancha){
  var v = document.createElement('div'); v.className = 'erp-vel';
  v.innerHTML = '<div class="erp-ven' + (ancha ? ' ancha' : '') + '" role="dialog" aria-modal="true"><header><h3>' + titulo + '</h3><button type="button" aria-label="Cerrar">×</button></header>' +
    '<div class="cuerpo">' + cuerpo + '</div><footer>' + (pie || '') + '</footer></div>';
  document.body.appendChild(v);
  var o = { el: v, cerrar: function(){ if (v.parentNode) { v.parentNode.removeChild(v); } } };
  v.querySelector('header button').onclick = o.cerrar;
  /* no se cierra con clic afuera: solo con la X o los botones */
  return o;
}
function leer(el){
  var o = {};
  el.querySelectorAll('[data-k]').forEach(function(i){ o[i.getAttribute('data-k')] = i.value; });
  return o;
}
function campo(k, et, v, tipo, extra){
  return '<div' + (extra && extra.c2 ? ' class="c2"' : '') + '><label>' + esc(et) + '</label><input data-k="' + k + '" type="' + (tipo || 'text') + '" value="' + esc(v == null ? '' : v) + '"' +
    (extra && extra.step ? ' step="' + extra.step + '"' : '') + (extra && extra.ph ? ' placeholder="' + esc(extra.ph) + '"' : '') + '></div>';
}
function selCampo(k, et, lista, sel, vacio, c2){
  return '<div' + (c2 ? ' class="c2"' : '') + '><label>' + esc(et) + '</label><select data-k="' + k + '">' + eOpts(lista, sel, vacio) + '</select></div>';
}
function eGuardar(btn, fn){
  btn.disabled = true; var t = btn.textContent; btn.textContent = 'Guardando…';
  return fn().then(function(r){ btn.disabled = false; btn.textContent = t; return r; },
    function(e){ btn.disabled = false; btn.textContent = t; ptToast(e && e.message ? e.message : 'No se pudo guardar.'); throw e; });
}
function descargaPdf(r){
  var bin = atob(r.b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) { arr[i] = bin.charCodeAt(i); }
  var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
  var a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}
function pdfBtn(accion, folio, btn){
  btn.disabled = true; var t = btn.textContent; btn.textContent = 'Generando…';
  erp(accion, { Folio: folio }).then(function(r){ descargaPdf(r); btn.disabled = false; btn.textContent = t; },
    function(e){ btn.disabled = false; btn.textContent = t; ptToast(e.message); });
}

/* Partidas: cada una es un <tbody class="par"> con dos renglones (datos y opciones). Los precios, M2 y unidades los calcula el
   servidor (cotCalcular) con la tarifa de TARIFAS, la tinta, el multiplicador UV y los acabados; aqui solo se muestran. */
function acabDef(n){ var s = String(n || '').toUpperCase(); return (E.init.cat.ACABADOS_COT || []).filter(function(x){ return x.nombre.toUpperCase() === s; })[0] || null; }
function acabPide(n){ var d = acabDef(n); return !!d && (d.unidad === 'ojillo' || d.unidad === 'manual'); }
function acabPh(n){ var d = acabDef(n); return d && d.unidad === 'manual' ? '$ por m²' : 'ojillos por pieza'; }
function partidaHtml(l, bloq){
  l = l || {};
  var un = E.init.cat.UNIDADES_COT || ['m2', 'mtl', 'lamina', 'pz'], imps = E.init.cat.IMPRESIONES || ['Gran Formato', 'HD', 'UV', 'Sin impresión'];
  var calc = (Number(l.Ancho) || 0) * (Number(l.Alto) || 0) * (Number(l.Cantidad) || 1);
  var man = l.M2 && Math.abs(Number(l.M2) - calc) > 0.0001 && !(l.Acabado1 || l.Acabado2 || l.Acabado3) ? '1' : '';
  var imp = l.Impresion || 'Gran Formato', uv = imp === 'UV';
  var ac = [1, 2, 3].map(function(i){
    var n = l['Acabado' + i] || '';

    .sort(function(a, b){ return (ngNorm(a.Nombre).indexOf(v) === 0 ? 0 : 1) - (ngNorm(b.Nombre).indexOf(v) === 0 ? 0 : 1) || a.Nombre.localeCompare(b.Nombre); }).slice(0, 8);

var NG_MAX = 100 * 1048576, NG_CHICO = 6 * 1048576, NG_TROZO = 8 * 1048576;

/* ===================== CALCULO DE ARMADOS: acomodo de piezas en laminas (MaxRects) ===================== */
function MaxRects(W, H){ this.W = W; this.H = H; this.libres = [{ x: 0, y: 0, w: W, h: H }]; }
MaxRects.prototype.coloca = function(w, h, rota, heur){
  var mejor = null, EPS = 1e-6, pruebas = [[w, h, false]];
  if (rota && Math.abs(w - h) > EPS) { pruebas.push([h, w, true]); }
  for (var t = 0; t < pruebas.length; t++) {
    var pw = pruebas[t][0], ph = pruebas[t][1];
    for (var i = 0; i < this.libres.length; i++) {
      var f = this.libres[i];
      if (pw <= f.w + EPS && ph <= f.h + EPS) {
        var lw = f.w - pw, lh = f.h - ph, a, b;
        if (heur === 'bssf') { a = Math.min(lw, lh); b = Math.max(lw, lh); }
        else if (heur === 'blsf') { a = Math.max(lw, lh); b = Math.min(lw, lh); }
        else if (heur === 'baf') { a = f.w * f.h - pw * ph; b = Math.min(lw, lh); }
        else { a = f.y + ph; b = f.x; }   /* bl: abajo-izquierda */
        if (!mejor || a < mejor.a - EPS || (Math.abs(a - mejor.a) <= EPS && b < mejor.b)) { mejor = { x: f.x, y: f.y, w: pw, h: ph, r: pruebas[t][2], a: a, b: b }; }
      }
    }
  }
  if (!mejor) { return null; }
  this.parte(mejor);
  return mejor;
};
MaxRects.prototype.parte = function(r){
  var nuevos = [], EPS = 1e-6;
  for (var i = 0; i < this.libres.length; i++) {
    var f = this.libres[i];
    if (r.x >= f.x + f.w - EPS || r.x + r.w <= f.x + EPS || r.y >= f.y + f.h - EPS || r.y + r.h <= f.y + EPS) { nuevos.push(f); continue; }
    if (r.x > f.x + EPS) { nuevos.push({ x: f.x, y: f.y, w: r.x - f.x, h: f.h }); }
    if (r.x + r.w < f.x + f.w - EPS) { nuevos.push({ x: r.x + r.w, y: f.y, w: f.x + f.w - (r.x + r.w), h: f.h }); }
    if (r.y > f.y + EPS) { nuevos.push({ x: f.x, y: f.y, w: f.w, h: r.y - f.y }); }
    if (r.y + r.h < f.y + f.h - EPS) { nuevos.push({ x: f.x, y: r.y + r.h, w: f.w, h: f.y + f.h - (r.y + r.h) }); }
  }
  this.libres = nuevos.filter(function(a, i){
    return !nuevos.some(function(b, j){ return i !== j && a.x >= b.x - EPS && a.y >= b.y - EPS && a.x + a.w <= b.x + b.w + EPS && a.y + a.h <= b.y + b.h + EPS && (i > j || Math.abs(a.w - b.w) > EPS || Math.abs(a.h - b.h) > EPS); });
  });
};
var ARM_ORDENES = {
  area: function(a, b){ return b.w * b.h - a.w * a.h; },
  lado: function(a, b){ return Math.max(b.w, b.h) - Math.max(a.w, a.h) || b.w * b.h - a.w * a.h; },
  alto: function(a, b){ return b.h - a.h || b.w - a.w; },
  ancho: function(a, b){ return b.w - a.w || b.h - a.h; },
  perim: function(a, b){ return (b.w + b.h) - (a.w + a.h); }
};
/* piezas: [{pi, w, h}] ya con el espacio de corte sumado; devuelve {hojas:[{col:[{pi,x,y,w,h,r}]}]} o {error} */
function armEmpaca(piezas, W, H, rota, orden, heur){
  var hojas = [];
  var lista = piezas.slice().sort(ARM_ORDENES[orden]);
  for (var i = 0; i < lista.length; i++) {
    var p = lista[i], pl = null, b;
    for (b = 0; b < hojas.length && !pl; b++) { pl = hojas[b].mr.coloca(p.w, p.h, rota, heur); if (pl) { pl.pi = p.pi; hojas[b].col.push(pl); } }
    if (!pl) {
      var nueva = { mr: new MaxRects(W, H), col: [] };
      pl = nueva.mr.coloca(p.w, p.h, rota, heur);
      if (!pl) { return { error: p }; }
      pl.pi = p.pi; nueva.col.push(pl); hojas.push(nueva);
    }
  }
  return { hojas: hojas.map(function(h){ return { col: h.col }; }) };
}
/* ¿caben todas las piezas en UNA lamina de W x H? prueba varias estrategias */
function armCabe(piezas, W, H, rota){
  var mejor = null, o, h;
  for (o in ARM_ORDENES) { for (h = 0; h < 4; h++) {
    var r = armEmpaca(piezas, W, H, rota, o, ['bssf', 'blsf', 'baf', 'bl'][h]);
    if (!r.error && r.hojas.length === 1) { return r.hojas[0].col; }
  } }
  return mejor;
}
/* mejor acomodo del trabajo completo. dim: {W, H, k, rota}. prods: [{w,h,q}] en cm. Devuelve {hojas, laminas, media, ...} o {error:'texto'} */
function armCalcula(prods, W, H, k, rota){
  var piezas = [], i, j;
  for (i = 0; i < prods.length; i++) { for (j = 0; j < prods[i].q; j++) { piezas.push({ pi: i, w: prods[i].w + k, h: prods[i].h + k }); } }
  if (!piezas.length) { return { error: 'Agrega al menos un producto con medidas y cantidad.' }; }
  var BW = W + k, BH = H + k, mejor = null;
  for (i = 0; i < prods.length; i++) {
    var a = prods[i].w + k, b = prods[i].h + k;
    var cabe = (a <= BW + 1e-6 && b <= BH + 1e-6) || (rota && b <= BW + 1e-6 && a <= BH + 1e-6);
    if (!cabe) { return { error: 'La pieza «' + (prods[i].nombre || 'Producto ' + (i + 1)) + '» (' + prods[i].w + ' × ' + prods[i].h + ' cm) no cabe en la lámina de ' + W + ' × ' + H + ' cm' + (rota ? '.' : ' (sin rotar). Activa «Permitir girar 90°».') }; }
  }
  var o, h;
  for (o in ARM_ORDENES) { for (h = 0; h < 4; h++) {
    var r = armEmpaca(piezas, BW, BH, rota, o, ['bssf', 'blsf', 'baf', 'bl'][h]);
    if (r.error) { continue; }
    var n = r.hojas.length, ult = r.hojas[n - 1].col, media = null;
    /* ¿lo de la ultima lamina cabe en una MEDIA lamina simetrica (mitad del ancho o mitad del alto)? */
    var ps = ult.map(function(c){ return { pi: c.pi, w: c.r ? c.h : c.w, h: c.r ? c.w : c.h }; });
    var m1 = armCabe(ps, W / 2 + k, BH, rota), m2 = m1 ? null : armCabe(ps, BW, H / 2 + k, rota);
    if (m1) { media = { dir: 'ancho', col: m1 }; } else if (m2) { media = { dir: 'alto', col: m2 }; }
    var need = (n - 1) + (media ? 0.5 : 1), usadoUlt = ult.reduce(function(s, c){ return s + c.w * c.h; }, 0);
    if (!mejor || need < mejor.need - 1e-9 || (Math.abs(need - mejor.need) < 1e-9 && usadoUlt < mejor.usadoUlt)) { mejor = { hojas: r.hojas, need: need, media: media, usadoUlt: usadoUlt }; }
  } }
  if (!mejor) { return { error: 'No se pudo acomodar el trabajo.' }; }
  var hojas = mejor.hojas.map(function(x){ return x.col; });
  if (mejor.media) { hojas[hojas.length - 1] = mejor.media.col; }
  var area = 0; hojas.forEach(function(c){ c.forEach(function(p){ area += (p.w - k) * (p.h - k); }); });
  var cuenta = prods.map(function(){ return 0; }); hojas.forEach(function(c){ c.forEach(function(p){ cuenta[p.pi]++; }); });
  return { hojas: hojas, laminas: mejor.need, completas: hojas.length - (mejor.media ? 1 : 0), media: mejor.media ? mejor.media.dir : '', areaPiezas: area, areaUsada: mejor.need * W * H, cuenta: cuenta, W: W, H: H, k: k };
}

function armCalcular(){

  var prods = armLeeFilas();
  if (!prods.length) { return ptToast('Agrega al menos un producto con medidas.'); }
  for (var i = 0; i < prods.length; i++) { if (!(prods[i].w > 0 && prods[i].h > 0 && prods[i].q >= 1)) { return ptToast('Completa ancho, alto y cantidad de «' + prods[i].nombre + '».'); } }

/* ===================== CARGA DE MATERIAL (alimenta la hoja TARIFAS) ===================== */
function calcTar(p){
  var costo = Number(p.COSTO) || 0, an = Number(p.ANCHO) || 0, la = Number(p.LARGO) || 0, pres = p.PRESENTACION, cobro = p.COBRO_POR, m2p = an * la;
  var c = { m2: null, mtl: null, lamina: null, pz: null };
  if (m2p > 0) {
    c.m2 = costo / m2p;
    if (pres === 'rollo' || pres === 'bobina') { c.mtl = costo / la; }
    if (pres === 'lamina' || pres === 'hoja') { c.lamina = costo; }
    if (cobro === 'pz') { c.pz = costo; }
  } else if (cobro && cobro !== 'otro') { c[cobro] = costo; }
  return c;
}

  erp('tarifas').then(function(rows){
    E.cache.tars = rows;
    m.innerHTML = '<h2>Carga de material</h2><p class="erp-sub">Catálogo único de materiales y costos (hoja TARIFAS). Lo que cargues aquí aparece en todos los formularios y alimenta los precios de cotización. NA = no aplica cobro por esa unidad.</p>' +
      '<div class="erp-bar"><input id="tarQ" placeholder="Buscar material o proveedor" oninput="pintaTars()" style="min-width:260px"><span class="sp"></span><button class="erp-btn nar" type="button" onclick="tarForm()">+ Nuevo material</button></div><div id="tarTabla"></div>';
    pintaTars();

    rows.slice(0, 400).map(function(t){ return '<tr class="clic" onclick="tarForm(\'' + esc(t.material).replace(/'/g, "\\'") + '\')"><td><b>' + esc(t.material) + '</b></td><td>' + esc(t.proveedor) + '</td><td>' + esc(t.presentacion) + '</td><td class="n">' + (t.ancho || '') + '</td><td class="n">' + (t.largo || '') + '</td><td class="n">' + (t.costo ? $m(t.costo) : '') + '</td><td>' + esc(t.cobroPor) + '</td><td class="n">' + na(t.costoM2) + '</td><td class="n">' + na(t.costoMtl) + '</td><td class="n">' + na(t.costoLamina) + '</td><td class="n">' + na(t.costoPz) + '</td></tr>'; }).join('') +

function tarEliminar(r){
  var u = r.uso, otros = E.cache.tars.map(function(x){ return x.material; }).filter(function(x){ return x !== r.material; });
  var usa = r.total > 0;
  var w = ventana('Eliminar material',
    '<p><b>' + esc(r.material) + '</b></p>' + (usa
      ? '<p class="erp-sub">Se usa en <b>' + r.total + '</b> registros: producción (BASE) ' + u.base + ', ventas ' + u.ventas + ', partidas de cotización ' + u.cotizaciones + ', partidas de ODP ' + u.odp + '.</p>' +
        '<datalist id="erpRepl">' + otros.map(function(x){ return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' +
        '<div class="erp-form"><div class="c2"><label>Material que lo sustituye en esos registros</label><input data-k="REEMPLAZO" list="erpRepl" placeholder="Escribe para buscar el material"></div></div>' +
        '<p class="erp-sub" style="margin-top:10px">Los registros cambian de material pero <b>conservan los precios y costos que ya tenían</b>: no se recalculan con la tarifa del material nuevo.</p>'
      : '<p class="erp-sub">Ningún registro usa este material; se elimina de TARIFAS y de todas las listas.</p>'),
    '<button class="erp-btn sec" id="tdNo">Cancelar</button><button class="erp-btn rojo" id="tdSi">Eliminar</button>');
  w.el.querySelector('#tdNo').onclick = w.cerrar;
  var b = w.el.querySelector('#tdSi');
  b.onclick = function(){
    var p = { MATERIAL: r.material }; if (usa) { p.REEMPLAZO = (w.el.querySelector('[data-k=REEMPLAZO]').value || '').trim(); if (!p.REEMPLAZO) { ptToast('Elige el material que lo sustituye.'); return; } }
    if (!confirm('¿Eliminar "' + r.material + '"' + (usa ? ' y pasar sus ' + r.total + ' registros a "' + p.REEMPLAZO + '"' : '') + '? No se puede deshacer.')) { return; }
    eGuardar(b, function(){ return erp('deleteTarifa', p); }).then(function(x){
      w.cerrar(); ptToast('Material eliminado' + (x.sustituidoPor ? ' y sustituido por ' + x.sustituidoPor : '') + '.');
      erp('catalogosProd').then(function(c){ E.cat = c; }); vCarga(eq('erpMain'));
    }, function(){});
  };
}

/* ===================== USUARIOS DEL ERP ===================== */
function vUsuarios(m){
  erp('usuarios').then(function(rows){
    E.cache.users = rows;
    m.innerHTML = '<h2>Usuarios del ERP</h2><p class="erp-sub">Quién entra al ERP y con qué rol. El rol decide qué módulos ve y qué puede hacer; los socios entran como Dirección (solo lectura).</p>' +
      '<div class="erp-bar"><span class="sp"></span><button class="erp-btn nar" type="button" onclick="usrForm()">+ Agregar usuario</button></div>' +
      '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Activo</th><th>Prefijo cot.</th><th>Comisión</th></tr></thead><tbody>' +
      rows.map(function(u){ return '<tr class="clic" onclick="usrForm(\'' + esc(u.Email) + '\')"><td>' + esc(u.Email) + '</td><td>' + esc(u.Nombre) + '</td><td>' + esc(u.Rol) + '</td><td>' + esc(u.Activo) + '</td><td>' + esc(u.PrefijoCot) + '</td><td>' + esc(CM_TIPO[u.TipoComision] || (u.TipoComision || 'Sin definir')) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="erp-card" style="margin-top:16px"><h3>Roles</h3><p class="erp-sub" style="margin:0">ADMIN: todo · COMERCIAL: sus clientes, cotizaciones y ODP · PRODUCCION: ODP, producción y consumo · ALMACEN: inventario y compras · FINANZAS: facturas, cobros, compras y costos · DIRECCION: consulta total · CONSULTA: consulta sin costos.</p></div>';
  }, function(e){ erpError(m, e); });
}
function usrForm(email){
  var u = email ? E.cache.users.filter(function(x){ return x.Email === email; })[0] : {};
  var w = ventana(email ? 'Usuario' : 'Agregar usuario', '<div class="erp-form">' + campo('Email', 'Correo', u.Email, 'email', { c2: 1 }) + campo('Nombre', 'Nombre', u.Nombre) + selCampo('Rol', 'Rol', E.init.cat.ROLES_ERP, u.Rol || 'COMERCIAL', false) +
    selCampo('Activo', 'Activo', ['SI', 'NO'], u.Activo || 'SI', false) + campo('PrefijoCot', 'Prefijo de cotización (ej. CP)', u.PrefijoCot) +
    selCampo('TipoComision', 'Tipo de comisión', [{ v: 'VENDEDOR', t: 'Vendedor (5%)' }, { v: 'ADMINISTRATIVO', t: 'Administrativo (3.3%)' }, { v: 'GERENCIA', t: 'Gerencia general (4%)' }, { v: 'NINGUNA', t: 'No comisiona (omitir)' }], u.TipoComision || '', 'Sin definir') + '</div>', '<button class="erp-btn" id="usG">Guardar</button>');
  if (email) { w.el.querySelector('[data-k=Email]').disabled = true; }
  var b = w.el.querySelector('#usG');
  b.onclick = function(){ var p = leer(w.el); if (email) { p.Email = email; } eGuardar(b, function(){ return erp('saveUsuario', p); }).then(function(){ w.cerrar(); ptToast('Usuario guardado.'); vUsuarios(eq('erpMain')); }, function(){}); };
}

/* ===================== ADMINISTRACION: costos de acabados y parametros del cotizador ===================== */
var CS = { d: null };
var CS_UN = { pz: 'por pieza', m2: 'por m² (con lo que crece)', ml: 'por metro lineal (perímetro)', ojillo: 'por ojillo (pide cuántos por pieza)', manual: 'por m², costo capturado en cada cotización (COSTURA)' };
var CS_PAR = { COT_MARGEN: 'Margen (0.40 = precio = costo ÷ 0.60)', COT_TINTA_GF: 'Tinta Gran Formato ($ por m²)', COT_TINTA_HD: 'Tinta HD ($ por m²)', COT_TINTA_UV: 'Tinta UV ($ por m²)' };
function vCostos(m){
  erp('acabados').then(function(d){
    CS.d = d;
    m.innerHTML = '<h2>Costos de acabados</h2><p class="erp-sub">Lo que suma cada acabado al costo de la cotización (el precio sale de costo ÷ 0.60). Las <b>bolsas</b> no cuestan, pero agregan centímetros al ancho y al alto de la pieza y por eso suben los m². Los cambios aplican a las cotizaciones que captures o edites desde ahora.</p>' +
      '<div class="erp-bar"><span class="sp"></span><button class="erp-btn nar" type="button" onclick="csForm()">+ Agregar acabado</button></div>' +
      '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>Acabado</th><th>Se cobra</th><th class="n">Costo</th><th class="n">Crece ancho y alto</th><th>Activo</th></tr></thead><tbody>' +
      d.rows.map(function(a){ return '<tr class="clic" onclick="csForm(\'' + esc(a.Nombre).replace(/'/g, '') + '\')"><td><b>' + esc(a.Nombre) + '</b></td><td>' + esc(CS_UN[a.Unidad] || a.Unidad) + '</td><td class="n">' + $m(a.Costo) + '</td><td class="n">' + (Number(a.Incremento) > 0 ? '+' + a.Incremento + ' cm' : '—') + '</td><td>' + esc(a.Activo) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="erp-card" style="margin-top:16px"><h3>Parámetros del cotizador</h3><p class="erp-sub" style="margin:0 0 8px">Margen y costo de tinta por m². Quedan en la hoja ERP_Config.</p>' +
      d.params.filter(function(p){ return CS_PAR[p.Clave]; }).map(function(p){ return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><label style="flex:1;font-size:13px">' + esc(CS_PAR[p.Clave] || p.Descripcion || p.Clave) + '</label><input type="number" step="0.01" id="csP_' + esc(p.Clave) + '" value="' + esc(p.Valor) + '" style="width:110px"><button type="button" class="erp-btn sec chico" onclick="csParam(\'' + esc(p.Clave) + '\')">Guardar</button></div>'; }).join('') + '</div>';
  }, function(e){ erpError(m, e); });
}
function csParam(clave){
  var b = event.target, v = eq('csP_' + clave).value;
  eGuardar(b, function(){ return erp('saveConfig', { Clave: clave, Valor: v }); }).then(function(){ ptToast('Parámetro guardado.'); }, function(){});
}
function csForm(nombre){
  var a = nombre ? CS.d.rows.filter(function(x){ return x.Nombre === nombre; })[0] : { Unidad: 'm2', Costo: 0, Incremento: 0, Activo: 'SI' };
  var w = ventana(nombre ? 'Acabado' : 'Agregar acabado', '<div class="erp-form">' + campo('Nombre', 'Nombre del acabado', a.Nombre, 'text', { c2: 1 }) +
    '<div class="c2"><label>Se cobra</label><select data-k="Unidad">' + eOpts(CS.d.unidades.map(function(x){ return { v: x, t: CS_UN[x] || x }; }), a.Unidad, false) + '</select></div>' +
    campo('Costo', 'Costo ($ por la unidad elegida)', a.Costo, 'number', { step: '0.01' }) + campo('Incremento', 'Crece el ancho y el alto (cm)', a.Incremento, 'number', { step: '1' }) +
    selCampo('Activo', 'Activo (aparece en cotizaciones)', ['SI', 'NO'], a.Activo || 'SI', false) +
    '</div><p class="erp-sub" style="margin-top:8px">Ejemplo: «Crece 50 cm» suma 50 cm al ancho y 50 cm al alto antes de calcular los m². Déjalo en 0 si el acabado no cambia el tamaño.</p>', '<button class="erp-btn" id="csG">Guardar</button>');
  var b = w.el.querySelector('#csG');
  b.onclick = function(){
    var d = leer(w.el); if (nombre) { d.NombreOriginal = nombre; }
    eGuardar(b, function(){ return erp('saveAcabado', d); }).then(function(r){ E.init.cat.ACABADOS_COT = r.publicos; w.cerrar(); ptToast('Acabado guardado.'); vCostos(eq('erpMain')); }, function(){});
  };
}
</script>
