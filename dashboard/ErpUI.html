     Habla con el servidor solo por erpApi(accion, payloadJson, clave); el servidor valida permisos en cada llamada. -->
<style>
#appErp{min-height:100vh; display:flex; flex-direction:column; background:var(--fondo); font-family:'Montserrat',-apple-system,'Segoe UI',Arial,sans-serif; color:var(--tinta); font-size:14px}
#appErp.oculto{display:none !important}
#appErp *{box-sizing:border-box}
.erp-top{background:var(--azul-b); color:#fff; display:flex; align-items:center; gap:16px; padding:10px 20px; position:sticky; top:0; z-index:30}
.erp-top img{height:34px; width:auto; display:block}
.erp-top h1{font:700 18px Khand,Poppins,sans-serif; letter-spacing:.04em; margin:0; text-transform:uppercase}
.erp-top .erp-quien{margin-left:auto; font-size:12px; color:#D6E0F7; text-align:right}
.erp-body{display:flex; flex:1; min-height:0}
.erp-nav{width:210px; flex:none; background:#fff; border-right:1px solid var(--linea); padding:14px 10px; position:sticky; top:54px; align-self:flex-start; height:calc(100vh - 54px); overflow:auto}
.erp-nav button{display:block; width:100%; text-align:left; background:none; border:none; padding:10px 12px; border-radius:8px; font:600 13px Montserrat,sans-serif; color:var(--tinta-2); cursor:pointer; margin-bottom:2px}
.erp-nav button:hover{background:var(--azul-t); color:var(--azul)}
.erp-nav button.on{background:var(--azul); color:#fff}
.erp-nav button[disabled]{opacity:.45; cursor:default}
.erp-nav small{display:block; font:700 10px Montserrat,sans-serif; letter-spacing:.08em; color:var(--tinta-3); text-transform:uppercase; padding:12px 12px 4px}
.erp-main{flex:1; min-width:0; padding:20px 24px 60px; max-width:1400px}
.erp-main h2{font:700 22px Khand,Poppins,sans-serif; margin:0 0 4px; color:var(--azul); letter-spacing:.02em; text-transform:uppercase}
.erp-main .erp-sub{color:var(--tinta-2); margin:0 0 16px; font-size:13px}
.erp-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px}
.erp-bar input,.erp-bar select{padding:8px 10px; border:1px solid var(--linea); border-radius:8px; font:inherit; background:#fff; min-width:0}
.erp-bar .sp{flex:1}
.erp-btn{background:var(--azul); color:#fff; border:none; border-radius:8px; padding:9px 16px; font:700 13px Montserrat,sans-serif; cursor:pointer}
.erp-btn:hover{background:var(--azul-b)}
.erp-btn.sec{background:#fff; color:var(--azul); border:1px solid var(--azul)}
.erp-btn.nar{background:var(--naranja)} .erp-btn.nar:hover{background:var(--naranja-d)}
.erp-btn.rojo{background:var(--rojo)}
.erp-btn[disabled]{opacity:.5; cursor:default}
.erp-btn.chico{padding:6px 11px; font-size:12px; height:auto; line-height:1.2; white-space:nowrap; min-width:0}
.erp-card{background:#fff; border:1px solid var(--linea); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:var(--sombra)}
.erp-card h3{margin:0 0 10px; font:700 14px Montserrat,sans-serif; color:var(--azul)}
.erp-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px}
.erp-kpi{background:#fff; border:1px solid var(--linea); border-radius:12px; padding:12px 14px}
.erp-kpi b{display:block; font:700 20px Khand,Poppins,sans-serif; color:var(--azul)}
.erp-kpi span{font-size:11px; color:var(--tinta-2); text-transform:uppercase; letter-spacing:.04em}
.erp-kpi.mal b{color:var(--rojo)}
.erp-tabla{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--linea); border-radius:10px; overflow:hidden}
.erp-tabla th{background:var(--azul-t); color:var(--azul); font:700 11px Montserrat,sans-serif; text-transform:uppercase; letter-spacing:.04em; text-align:left; padding:9px 10px; white-space:nowrap}
.erp-tabla td,.erp-tabla th{text-align:left}
.erp-tabla td{padding:8px 10px; border-top:1px solid var(--linea); font-size:13px; vertical-align:top}
.erp-tabla tr.clic{cursor:pointer} .erp-tabla tr.clic:hover td{background:#F7FAFD}
.erp-tabla .n{text-align:right !important; white-space:nowrap}
.erp-scroll{overflow-x:auto}
.erp-pill{display:inline-block; padding:2px 9px; border-radius:999px; font:700 11px Montserrat,sans-serif; background:#EEF2F6; color:var(--tinta-2)}
.erp-pill.ok{background:var(--verde-l); color:var(--verde)} .erp-pill.mal{background:var(--rojo-l); color:var(--rojo)}
.erp-pill.az{background:var(--azul-t); color:var(--azul)} .erp-pill.am{background:var(--ambar-l); color:#9A6A00}
.erp-vacio{padding:30px; text-align:center; color:var(--tinta-3)}
.erp-err{background:var(--rojo-l); color:var(--rojo); border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:13px}
.erp-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px}
/* ventanas */
.erp-vel{position:fixed; inset:0; background:rgba(24,48,60,.55); z-index:60; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:30px 12px}
.erp-ven{background:#fff; border-radius:14px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.erp-ven.ancha{max-width:1000px}
.erp-ven header{display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid var(--linea)}
.erp-ven header h3{margin:0; font:700 16px Montserrat,sans-serif; color:var(--azul); flex:1}
.erp-ven header button{background:none; border:none; font-size:22px; cursor:pointer; color:var(--tinta-3)}
.erp-ven .cuerpo{padding:16px 18px}
.erp-ven footer{padding:12px 18px; border-top:1px solid var(--linea); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.erp-form{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 14px}
.erp-form .c2{grid-column:1/-1}
.erp-form label{display:block; font:700 11px Montserrat,sans-serif; color:var(--tinta-2); text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px}
.erp-form input,.erp-form select,.erp-form textarea{width:100%; padding:8px 10px; border:1px solid var(--linea); border-radius:8px; font:inherit; background:#fff}
.erp-form textarea{min-height:60px; resize:vertical}
.erp-lin input,.erp-lin select{width:100%; padding:6px 7px; border:1px solid var(--linea); border-radius:6px; font:inherit; font-size:12.5px; min-width:60px}
.erp-lin td{padding:4px}
.erp-tot{text-align:right; margin-top:8px; font-size:13px} .erp-tot b{font-size:15px}
@media (max-width:820px){
  .erp-body{flex-direction:column}
  .erp-nav{width:100%; height:auto; position:static; display:flex; flex-wrap:wrap; gap:4px; border-right:none; border-bottom:1px solid var(--linea)}
  .erp-nav button{width:auto} .erp-nav small{display:none}
  .erp-main{padding:14px 12px 50px}
  .erp-form{grid-template-columns:1fr}
}
</style>

<div id="appErp" class="oculto">
  <div class="erp-top">
    <img id="erpLogo" alt="bigfoot print">
    <h1>ERP</h1>
    <button type="button" class="b-inicio" onclick="erpSalir()" style="margin-left:8px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Inicio</button>
    <div class="erp-quien" id="erpQuien"></div>
  </div>
  <div class="erp-body">
    <nav class="erp-nav" id="erpNav" aria-label="Módulos del ERP"></nav>
    <main class="erp-main" id="erpMain"><div class="erp-vacio">Cargando…</div></main>
  </div>
</div>

<script>
/* ===================== ERP: utilidades ===================== */
var E = { init: null, lk: null, cat: {}, vista: '', cache: {}, filtro: {} };

function erp(accion, payload){
  return new Promise(function(res, rej){
    google.script.run
      .withSuccessHandler(function(t){
        var r; try { r = JSON.parse(t); } catch (x) { return rej(new Error('Respuesta inválida del servidor.')); }
        if (r.ok) { return res(r.data); }
        if (/No se pudo identificar/.test(r.error || '')) { sesionPerdida(); }
        rej(new Error(r.error || 'Error'));
      })
      .withFailureHandler(function(err){ if (esSesionPerdida(err)) { sesionPerdida(); } rej(err); })
      .erpApi(accion, JSON.stringify(payload || {}), CLAVE);
  });
}
function P(x){ var p = E.init ? E.init.perms : []; return p.indexOf('*') >= 0 || p.indexOf(x) >= 0; }
function PA(l){ return l.some(P); }
function $m(n){ n = Number(n) || 0; return (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function $n(n, d){ n = Number(n) || 0; return n.toLocaleString('es-MX', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }); }
function $p(n){ return ((Number(n) || 0) * 100).toFixed(1) + '%'; }
function fFecha(s){ s = String(s || ''); var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1].slice(2) : s; }
function hoyIso(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function eq(id){ return document.getElementById(id); }
function eOpts(lista, sel, vacio){
  return (vacio === false ? '' : '<option value="">' + esc(vacio || '—') + '</option>') +
    lista.map(function(x){ var v = typeof x === 'object' ? x.v : x, t = typeof x === 'object' ? x.t : x; return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
}
function ePill(txt){
  var t = String(txt || ''), c = '';
  if (/Aprobada|Pagada|Cerrada|COBRADO|Terminada/.test(t)) { c = 'ok'; }
  else if (/Rechazada|Cancelada|Vencid/.test(t)) { c = 'mal'; }
  else if (/producci|Parcial|Enviada|Negoci/.test(t)) { c = 'am'; }
  else if (/Abierta|Borrador|Pendiente|Facturada/.test(t)) { c = 'az'; }
  return '<span class="erp-pill ' + c + '">' + esc(t) + '</span>';
}
function erpError(el, e){ el.innerHTML = '<div class="erp-err"><b>No se pudo completar.</b> ' + esc(e && e.message ? e.message : String(e)) + '</div>'; }

/* ventana modal; devuelve {el, cerrar} */
function ventana(titulo, cuerpo, pie, ancha){
  var v = document.createElement('div'); v.className = 'erp-vel';
  v.innerHTML = '<div class="erp-ven' + (ancha ? ' ancha' : '') + '" role="dialog" aria-modal="true"><header><h3>' + titulo + '</h3><button type="button" aria-label="Cerrar">×</button></header>' +
    '<div class="cuerpo">' + cuerpo + '</div><footer>' + (pie || '') + '</footer></div>';
  document.body.appendChild(v);
  var o = { el: v, cerrar: function(){ if (v.parentNode) { v.parentNode.removeChild(v); } } };
  v.querySelector('header button').onclick = o.cerrar;
  v.addEventListener('mousedown', function(ev){ if (ev.target === v) { v.dataset.dn = '1'; } });
  v.addEventListener('mouseup', function(ev){ if (ev.target === v && v.dataset.dn) { o.cerrar(); } v.dataset.dn = ''; });
  return o;
}
function leer(el){
  var o = {};
  el.querySelectorAll('[data-k]').forEach(function(i){ o[i.getAttribute('data-k')] = i.value; });
  return o;
}
function campo(k, et, v, tipo, extra){
  return '<div' + (extra && extra.c2 ? ' class="c2"' : '') + '><label>' + esc(et) + '</label><input data-k="' + k + '" type="' + (tipo || 'text') + '" value="' + esc(v == null ? '' : v) + '"' +
    (extra && extra.step ? ' step="' + extra.step + '"' : '') + (extra && extra.ph ? ' placeholder="' + esc(extra.ph) + '"' : '') + '></div>';
}
function selCampo(k, et, lista, sel, vacio, c2){
  return '<div' + (c2 ? ' class="c2"' : '') + '><label>' + esc(et) + '</label><select data-k="' + k + '">' + eOpts(lista, sel, vacio) + '</select></div>';
}
function eGuardar(btn, fn){
  btn.disabled = true; var t = btn.textContent; btn.textContent = 'Guardando…';
  return fn().then(function(r){ btn.disabled = false; btn.textContent = t; return r; },
    function(e){ btn.disabled = false; btn.textContent = t; ptToast(e && e.message ? e.message : 'No se pudo guardar.'); throw e; });
}
function descargaPdf(r){
  var bin = atob(r.b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) { arr[i] = bin.charCodeAt(i); }
  var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
  var a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}
function pdfBtn(accion, folio, btn){
  btn.disabled = true; var t = btn.textContent; btn.textContent = 'Generando…';
  erp(accion, { Folio: folio }).then(function(r){ descargaPdf(r); btn.disabled = false; btn.textContent = t; },
    function(e){ btn.disabled = false; btn.textContent = t; ptToast(e.message); });
}

/* ===================== ERP: entrada y navegacion ===================== */
var NAV = [
  { id: 'inicio', t: 'Inicio', ver: function(){ return true; } },
  { g: 'Comercial' },
  { id: 'clientes', t: 'Clientes', ver: function(){ return PA(['crm', 'crm_ver', 'facturas', 'cxc']); } },
  { id: 'cotizaciones', t: 'Cotizaciones', ver: function(){ return PA(['crm', 'crm_ver']); } },
  { id: 'seguimiento', t: 'Seguimiento', ver: function(){ return PA(['crm', 'crm_ver']); } },
  { g: 'Operaciones' },
  { id: 'odp', t: 'Órdenes de producción', ver: function(){ return P('odp_ver'); } },
  { g: 'Finanzas' },
  { id: 'facturas', t: 'Facturas y cobros', ver: function(){ return PA(['cxc', 'cxc_ver', 'facturas']); } },
  { g: 'Próximamente' },
  { id: 'x1', t: 'Compras y proveedores', off: true, ver: function(){ return PA(['compras', 'cxp', 'cxp_ver']); } },
  { id: 'x2', t: 'Inventario', off: true, ver: function(){ return PA(['inv', 'inv_ver', 'conteo']); } },
  { g: 'Administración' },
  { id: 'usuarios', t: 'Usuarios del ERP', ver: function(){ return P('*'); } }
];
function abrirErp(){
  document.getElementById('appPortal').className = 'oculto';
  eq('appErp').className = '';
  window.scrollTo(0, 0);
  if (E.init) { return erpVista(E.vista || 'inicio'); }
  eq('erpMain').innerHTML = '<div class="erp-vacio">Cargando el ERP…</div>';
  Promise.all([erp('init'), erp('lookups'), erp('catalogosProd').catch(function(){ return {}; })]).then(function(r){
    E.init = r[0]; E.lk = r[1]; E.cat = r[2] || {};
    eq('erpQuien').innerHTML = '<b>' + esc(E.init.user.nombre) + '</b><br>' + esc(E.init.user.rol);
    var l = eq('erpLogo'); if (LOGO_BLANCO) { l.src = LOGO_BLANCO; } else { l.style.display = 'none'; }
    erpNav(); erpVista('inicio');
  }, function(e){ erpError(eq('erpMain'), e); });
}
function erpSalir(){
  eq('appErp').className = 'oculto';
  document.getElementById('appPortal').className = '';
  window.scrollTo(0, 0);
}
function erpNav(){
  var h = '', pend = '';
  NAV.forEach(function(n, i){
    if (n.g) { pend = n.g; return; }
    if (!n.ver()) { return; }
    if (pend) { h += '<small>' + esc(pend) + '</small>'; pend = ''; }
    h += '<button type="button" data-v="' + n.id + '"' + (n.off ? ' disabled title="Llega en la siguiente fase"' : ' onclick="erpVista(\'' + n.id + '\')"') + '>' + esc(n.t) + '</button>';
  });
  eq('erpNav').innerHTML = h;
}
function erpVista(v, arg){
  E.vista = v;
  eq('erpNav').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === v); });
  var m = eq('erpMain');
  m.innerHTML = '<div class="erp-vacio">Cargando…</div>';
  window.scrollTo(0, 0);
  var f = { inicio: vInicio, clientes: vClientes, cotizaciones: vCotizaciones, seguimiento: vSeguimiento, odp: vOdp, odpdet: vOdpDet, facturas: vFacturas, usuarios: vUsuarios }[v];
  if (f) { f(m, arg); }
}
function recargaLookups(){ return erp('lookups').then(function(l){ E.lk = l; }); }

/* ===================== INICIO ===================== */
function vInicio(m){
  var desde = hoyIso().slice(0, 8) + '01';
  erp('dashboard', { desde: desde, hasta: hoyIso() }).then(function(d){
    var h = '<h2>Inicio</h2><p class="erp-sub">Resumen del mes (' + fFecha(d.desde) + ' al ' + fFecha(d.hasta) + ')</p>';
    if (d.produccion) {
      var p = d.produccion;
      h += '<div class="erp-kpis">' + kpi('ODP del mes', p.odps) + kpi('Venta', $m(p.venta)) + kpi('Costo', $m(p.costo)) + kpi('Utilidad', $m(p.utilidad)) +
        kpi('Margen', $p(p.margen), p.margen < (E.init.cfg.MARGEN_MINIMO || 0)) + kpi('Merma', $p(p.mermaPct), p.mermaPct > (E.init.cfg.MERMA_ALERTA || 1)) +
        (d.cxc ? kpi('Por cobrar', $m(d.cxc.saldo)) + kpi('Vencido', $m(d.cxc.vencido), d.cxc.vencido > 0) : '') + '</div>';
    } else if (d.cxc) {
      h += '<div class="erp-kpis">' + kpi('Por cobrar', $m(d.cxc.saldo)) + kpi('Vencido', $m(d.cxc.vencido), d.cxc.vencido > 0) + '</div>';
    }
    if (d.crm) {
      h += '<div class="erp-kpis">' + kpi('Cotizaciones abiertas', d.crm.pipelineN) + kpi('Monto en pipeline', $m(d.crm.pipeline)) + kpi('Conversión', $p(d.crm.conversion)) + '</div>';
    }
    h += '<div class="erp-cols">';
    if (d.odpAbiertas) {
      h += '<div class="erp-card"><h3>ODP en curso (' + d.odpAbiertas.length + ')</h3>' + (d.odpAbiertas.length ? '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>ODP</th><th>Cliente</th><th>Entrega</th><th>Estatus</th></tr></thead><tbody>' +
        d.odpAbiertas.slice(0, 15).map(function(o){ return '<tr class="clic" onclick="erpVista(\'odpdet\',\'' + esc(o.Folio) + '\')"><td>' + esc(o.Folio) + '</td><td>' + esc(o.Cliente) + '<br><small>' + esc(o.Descripcion) + '</small></td><td>' +
          (o.Atrasada ? '<span class="erp-pill mal">' + fFecha(o.FechaEntrega) + '</span>' : fFecha(o.FechaEntrega)) + '</td><td>' + ePill(o.Estatus) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' : '<div class="erp-vacio">Sin ODP abiertas.</div>') + '</div>';
    }
    if (d.crm) {
      h += '<div class="erp-card"><h3>Seguimientos pendientes (' + d.crm.pendientes.length + ')</h3>' + (d.crm.pendientes.length ? '<table class="erp-tabla"><thead><tr><th>Fecha</th><th>Cliente</th><th>Ref.</th></tr></thead><tbody>' +
        d.crm.pendientes.slice(0, 15).map(function(s){ return '<tr><td>' + (s.Vencido ? '<span class="erp-pill mal">' + fFecha(s.Fecha) + '</span>' : fFecha(s.Fecha)) + '</td><td>' + esc(s.Cliente) + '</td><td>' + esc(s.Ref) + '</td></tr>'; }).join('') +
        '</tbody></table>' : '<div class="erp-vacio">Nada pendiente.</div>') + '</div>';
    }
    if (d.peoresMargen && d.peoresMargen.length) {
      h += '<div class="erp-card"><h3>Menor margen del mes</h3><table class="erp-tabla"><thead><tr><th>ODP</th><th>Cliente</th><th class="n">Venta</th><th class="n">Margen</th></tr></thead><tbody>' +
        d.peoresMargen.map(function(o){ return '<tr><td>' + esc(o.Folio) + '</td><td>' + esc(o.Cliente) + '</td><td class="n">' + $m(o.Venta) + '</td><td class="n">' + $p(o.Margen) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    h += '</div>';
    m.innerHTML = h;
  }, function(e){ erpError(m, e); });
}
function kpi(t, v, mal){ return '<div class="erp-kpi' + (mal ? ' mal' : '') + '"><b>' + esc(v) + '</b><span>' + esc(t) + '</span></div>'; }

/* ===================== CLIENTES ===================== */
function vClientes(m){
  erp('clientes').then(function(rows){
    E.cache.clientes = rows;
    m.innerHTML = '<h2>Clientes</h2><p class="erp-sub">Catálogo de clientes. Las cotizaciones y las ODP se ligan a un cliente.</p>' +
      '<div class="erp-bar"><input id="cliQ" placeholder="Buscar nombre, RFC o contacto" oninput="pintaClientes()" style="min-width:260px"><span class="sp"></span>' +
      (P('crm') ? '<button class="erp-btn nar" type="button" onclick="clienteForm()">+ Nuevo cliente</button>' : '') + '</div><div id="cliTabla"></div>';
    pintaClientes();
  }, function(e){ erpError(m, e); });
}
function pintaClientes(){
  var q = (eq('cliQ').value || '').toLowerCase();
  var rows = E.cache.clientes.filter(function(c){ return !q || [c.Nombre, c.RFC, c.Contacto, c.ID, c.RazonSocial].join(' ').toLowerCase().indexOf(q) >= 0; });
  eq('cliTabla').innerHTML = rows.length ? '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>ID</th><th>Nombre</th><th>RFC</th><th>Contacto</th><th>Teléfono</th><th>Comercial</th><th class="n">Crédito</th></tr></thead><tbody>' +

function lineaCotHtml(l){
  l = l || {};

  var calc = (Number(l.Ancho) || 0) * (Number(l.Alto) || 0) * (Number(l.Cantidad) || 1);
  var man = l.M2 && Math.abs(Number(l.M2) - calc) > 0.0001 ? '1' : '';

    '<td><select data-c="Unidad">' + eOpts(un, l.Unidad || 'm2', false) + '</select></td>' +
    '<td><input data-c="Cantidad" type="number" step="1" value="' + esc(l.Cantidad || 1) + '"></td><td><input data-c="PrecioM2" type="number" step="0.01" value="' + esc(l.PrecioM2 || '') + '"></td>' +

function cotCalc(tr){
  var inp = function(c){ return tr.querySelector('[data-c=' + c + ']'); };
  var g = function(c){ return Number(inp(c).value) || 0; };
  var an = g('Ancho'), al = g('Alto'), q = g('Cantidad') || 1, pm = g('PrecioM2'), man = inp('M2');
  if (!man.dataset.man) { var auto = Math.round(an * al * q * 10000) / 10000; man.value = auto || ''; }
  var m2 = Number(man.value) || 0, pu = inp('PrecioUnit'), imp;
  if (pm > 0 && m2 > 0) { imp = Math.round(m2 * pm * 100) / 100; pu.value = (Math.round(imp / q * 100) / 100) || ''; pu.readOnly = true; pu.title = 'Se calcula: $/m² × m² ÷ cantidad'; }
  else { pu.readOnly = false; pu.title = 'Precio por pieza (se usa cuando no hay $/m²)'; imp = q * Math.round((Number(pu.value) || 0) * 100) / 100; }
  return { importe: imp, m2: m2 };
}
function cotTotales(){

function vOdpDet(m, folio){
  Promise.all([erp('odpDetalle', { Folio: folio }), erp('produccionODP', { Folio: folio }).catch(function(){ return null; })]).then(function(r){
    var d = r[0], pr = r[1], o = d.odp, vc = E.init.cfg.VE_COSTOS, vp = E.init.cfg.VE_PRECIO;
    E.cache.det = d;
    var h = '<div class="erp-bar"><button class="erp-btn sec chico" type="button" onclick="erpVista(\'odp\')">‹ Órdenes de producción</button></div>' +
      '<h2>ODP ' + esc(o.Folio) + ' ' + ePill(o.Estatus) + '</h2><p class="erp-sub">' + esc(o.Cliente) + ' · ' + esc(o.Proyecto || o.Descripcion) + (o.Cotizacion ? ' · Cotización ' + esc(o.Cotizacion) : '') + ' · Entrega ' + (fFecha(o.FechaEntrega) || '—') + '</p>';
    h += '<div class="erp-kpis">' + kpi('m² vendidos', $n(o.M2Vendidos)) + (o.M2Usados !== undefined ? kpi('m² usados', $n(o.M2Usados)) : '') + (vp ? kpi('Venta', $m(o.Facturado > 0 ? o.Facturado : o.PrecioVenta)) : '') +
      (vc ? kpi('Costo', $m(o.CostoTotal)) + kpi('Utilidad', $m(o.Utilidad)) + kpi('Margen', o.CostoTotal ? $p(o.Margen) : '—', o.CostoTotal && o.Margen < (E.init.cfg.MARGEN_MINIMO || 0)) + kpi('Merma', o.M2Usados ? $p(o.MermaPct) : '—', o.MermaPct > (E.init.cfg.MERMA_ALERTA || 1)) : '') + '</div>';
    h += '<div class="erp-bar"><button class="erp-btn sec" id="dPdf" type="button">PDF de la ODP</button>' + (PA(['odp', 'crm']) ? '<button class="erp-btn sec" id="dEdit" type="button">Editar datos y partidas</button>' : '') +
      (PA(['odp', 'crm']) ? '<select id="dEst">' + eOpts(E.init.cat.EST_ODP, o.Estatus, false) + '</select><button class="erp-btn" id="dEstG" type="button">Cambiar estatus</button>' : '') + '</div>';
    // partidas
    h += '<div class="erp-card"><h3>Partidas</h3>' + (d.lineas.length ? '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>#</th><th class="n">Piezas</th><th class="n">Ancho</th><th class="n">Alto</th><th class="n">m²</th><th>Material</th><th>Máquina</th><th>Archivo</th><th>Acabados</th></tr></thead><tbody>' +
      d.lineas.map(function(l){ return '<tr><td>' + l.Linea + '</td><td class="n">' + esc(l.Piezas) + '</td><td class="n">' + esc(l.Ancho) + '</td><td class="n">' + esc(l.Alto) + '</td><td class="n">' + $n(l.M2) + '</td><td>' + esc(l.Material) + '</td><td>' + esc(l.Maquina) + '</td><td>' + esc(l.Archivo) + '</td><td>' + esc(l.Acabados) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="erp-vacio">Sin partidas.</div>') + '</div>';
    // produccion
    h += '<div class="erp-card"><h3>Producción registrada (alimenta BASE)</h3>';
    if (pr) {
      h += '<p class="erp-sub" style="margin-bottom:8px">Total: ' + $n(pr.tot.cant) + ' producidos · ' + $n(pr.tot.merma) + ' de merma · ' + $n(pr.tot.horas) + ' h máquina</p>' +
        (pr.rows.length ? '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>Fecha</th><th>Máquina</th><th>Proceso</th><th>Material</th><th class="n">Cant.</th><th>Unidad</th><th class="n">Merma</th><th class="n">Horas</th><th>Operador</th><th>Origen</th></tr></thead><tbody>' +
        pr.rows.map(function(b){ return '<tr><td>' + fFecha(b.fecha) + '</td><td>' + esc(b.maquina) + '</td><td>' + esc(b.proceso) + '</td><td>' + esc(b.material) + '</td><td class="n">' + $n(b.cant) + '</td><td>' + esc(b.unidad) + '</td><td class="n">' + (b.merma ? $n(b.merma) : '') + '</td><td class="n">' + (b.horas ? $n(b.horas) : '') + '</td><td>' + esc(b.operador) + '</td><td>' + esc(b.origen) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="erp-vacio">Aún no se registra producción.</div>');
    }
    if (P('prod') && ['Cerrada', 'Cancelada'].indexOf(o.Estatus) < 0) { h += '<div class="erp-bar" style="margin-top:10px"><button class="erp-btn nar" type="button" id="dProd">+ Registrar producción</button></div>'; }
    h += '</div>';
    // costos
    if (d.costos && (vc || d.costos.length)) {
      h += '<div class="erp-card"><h3>Costos de la ODP</h3>' + (d.costos.length ? '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th>' + (vc ? '<th class="n">Importe</th>' : '') + '</tr></thead><tbody>' +
        d.costos.map(function(c){ return '<tr><td>' + fFecha(c.Fecha) + '</td><td>' + esc(c.Tipo) + '</td><td>' + esc(c.Concepto) + '</td>' + (vc ? '<td class="n">' + $m(c.Importe) + '</td>' : '') + '</tr>'; }).join('') + '</tbody></table></div>' : '<div class="erp-vacio">Sin costos capturados.</div>') +
        (PA(['odp', 'fin']) && ['Cerrada', 'Cancelada'].indexOf(o.Estatus) < 0 ? '<div class="erp-bar" style="margin-top:10px"><button class="erp-btn sec" type="button" id="dCosto">+ Agregar costo (mano de obra, instalación, maquila…)</button></div>' : '') + '</div>';
    }
    if (d.facturas && d.facturas.length) {
      h += '<div class="erp-card"><h3>Facturas</h3><table class="erp-tabla"><thead><tr><th>Folio</th><th>Fecha</th><th class="n">Total</th><th class="n">Saldo</th><th>Estatus</th></tr></thead><tbody>' +
        d.facturas.map(function(f){ return '<tr><td>' + esc(f.FolioSAT) + '</td><td>' + fFecha(f.Fecha) + '</td><td class="n">' + $m(f.Total) + '</td><td class="n">' + $m(f.Saldo) + '</td><td>' + ePill(f.Estatus) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    m.innerHTML = h;
    var q = function(id){ return m.querySelector(id); };
    q('#dPdf').onclick = function(){ pdfBtn('pdfODP', folio, this); };
    if (q('#dEdit')) { q('#dEdit').onclick = function(){ odpForm(folio, d); }; }
    if (q('#dEstG')) { var be = q('#dEstG'); be.onclick = function(){ eGuardar(be, function(){ return erp('saveODP', { Folio: folio, Estatus: q('#dEst').value }); }).then(function(){ ptToast('Estatus actualizado.'); recargaLookups(); vOdpDet(m, folio); }, function(){}); }; }
    if (q('#dProd')) { q('#dProd').onclick = function(){ prodForm(folio, d); }; }
    if (q('#dCosto')) { q('#dCosto').onclick = function(){ costoForm(folio); }; }
  }, function(e){ erpError(m, e); });
}
function prodForm(folio, d){
  var c = E.cat, lin = d.lineas[0] || {};
  var w = ventana('Registrar producción · ODP ' + esc(folio),
    '<div class="erp-form">' + campo('fecha', 'Fecha', hoyIso(), 'date') + selCampo('maquina', 'Máquina', c.MAQUINA || [], lin.Maquina, 'Elige', 0) + selCampo('proceso', 'Proceso', c.PROCESO || [], '', 'Elige', 0) +
    selCampo('material', 'Material', c.MATERIAL || [], lin.Material, 'Elige', 0) + campo('cant', 'Cantidad producida', '', 'number', { step: '0.01' }) + selCampo('unidad', 'Unidad', c.UNIDAD || [], 'MT2', 'Elige', 0) +
    selCampo('origen', 'Origen', c.ORIGEN || [], 'PLANTA', 'Elige', 0) + campo('merma', 'Merma (m²)', '', 'number', { step: '0.01' }) + campo('horas', 'Horas máquina', '', 'number', { step: '0.1' }) +
    selCampo('turno', 'Turno', c.TURNO || [], '', '—') + selCampo('operador', 'Operador', c.OPERADOR || [], '', '—') + selCampo('paro', 'Motivo de paro', c.MOTIVO_PARO || [], '', '—') +
    selCampo('reimp', '¿Reimpresión?', ['NO', 'SI'], 'NO', false) + selCampo('acabado1', 'Acabado 1', c.ACABADO || [], '', '—') + selCampo('acabado2', 'Acabado 2', c.ACABADO || [], '', '—') + selCampo('acabado3', 'Acabado 3', c.ACABADO || [], '', '—') +
    '<div class="c2"><label>Nota (obligatoria si es reimpresión)</label><textarea data-k="nota"></textarea></div></div>', '<button class="erp-btn" id="prG">Guardar</button>', true);
  var b = w.el.querySelector('#prG');
  b.onclick = function(){ var p = leer(w.el); p.ODP = folio; eGuardar(b, function(){ return erp('registrarProduccion', p); }).then(function(){ w.cerrar(); ptToast('Producción registrada en BASE.'); vOdpDet(eq('erpMain'), folio); }, function(){}); };
}
function costoForm(folio){
  var w = ventana('Agregar costo · ODP ' + esc(folio), '<div class="erp-form">' + selCampo('Tipo', 'Tipo', E.init.cat.TIPOS_COSTO, 'Mano de obra', false) + campo('Fecha', 'Fecha', hoyIso(), 'date') + campo('Concepto', 'Concepto', '', 'text', { c2: 1 }) +
    campo('Cantidad', 'Cantidad', 1, 'number', { step: '0.01' }) + campo('CostoUnit', 'Costo unitario', '', 'number', { step: '0.01' }) + '</div>', '<button class="erp-btn" id="coG">Guardar</button>');
  var b = w.el.querySelector('#coG');
  b.onclick = function(){ var p = leer(w.el); p.ODP = folio; eGuardar(b, function(){ return erp('agregarCosto', p); }).then(function(){ w.cerrar(); ptToast('Costo agregado.'); vOdpDet(eq('erpMain'), folio); }, function(){}); };
}

/* ===================== FACTURAS Y COBROS ===================== */
function vFacturas(m){
  erp('facturas').then(function(rows){
    E.cache.facts = rows;
    m.innerHTML = '<h2>Facturas y cobros</h2><p class="erp-sub">Las facturas ligadas a una ODP actualizan su estatus de cobro en el Dashboard.</p>' +
      '<div class="erp-bar"><input id="facQ" placeholder="Buscar folio, cliente u ODP" oninput="pintaFacts()" style="min-width:240px"><select id="facE" onchange="pintaFacts()">' + eOpts(['Pendiente', 'Parcial', 'Pagada', 'Cancelada'], '', 'Todos los estatus') + '</select><span class="sp"></span>' +
      (P('facturas') ? '<button class="erp-btn nar" type="button" onclick="facForm()">+ Nueva factura</button>' : '') + '</div><div id="facTabla"></div>';
    pintaFacts();
  }, function(e){ erpError(m, e); });
}
function pintaFacts(){
  var q = (eq('facQ').value || '').toLowerCase(), est = eq('facE').value;
  var rows = E.cache.facts.filter(function(f){ return (!est || f.Estatus === est) && (!q || [f.FolioSAT, f.Cliente, f.ODP, f.ID].join(' ').toLowerCase().indexOf(q) >= 0); });
  eq('facTabla').innerHTML = rows.length ? '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>ODP</th><th class="n">Total</th><th class="n">Saldo</th><th>Vence</th><th>Estatus</th><th></th></tr></thead><tbody>' +
    rows.slice(0, 300).map(function(f){ return '<tr><td><b>' + esc(f.FolioSAT) + '</b></td><td>' + fFecha(f.Fecha) + '</td><td>' + esc(f.Cliente) + '</td><td>' + esc(f.ODP) + '</td><td class="n">' + $m(f.Total) + '</td><td class="n">' + $m(f.Saldo) + '</td><td>' + (f.Vencido ? '<span class="erp-pill mal">' + fFecha(f.Vencimiento) + '</span>' : fFecha(f.Vencimiento)) + '</td><td>' + ePill(f.Estatus) + '</td><td>' +
      (P('cxc') && f.Estatus !== 'Cancelada' && f.Saldo > 0.009 ? '<button class="erp-btn chico" type="button" onclick="cobroForm(\'' + esc(f.ID) + '\')">Cobro</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="erp-vacio">Sin facturas.</div>';
}
function facForm(){
  var clis = (E.lk.clientes || []).map(function(x){ return { v: x.ID, t: x.Nombre }; });
  var odps = (E.lk.odps || []).map(function(x){ return { v: x.Folio, t: x.Folio + ' · ' + x.Cliente }; });
  var w = ventana('Nueva factura emitida', '<div class="erp-form">' + selCampo('ODP', 'ODP (recomendado)', odps, '', 'Sin ODP', 1) + selCampo('ClienteID', 'Cliente (si no hay ODP)', clis, '', '—', 1) + campo('FolioSAT', 'Folio / UUID', '') + campo('Fecha', 'Fecha', hoyIso(), 'date') +
    campo('Subtotal', 'Subtotal (sin IVA)', '', 'number', { step: '0.01' }) + campo('IVA', 'IVA (vacío = automático)', '', 'number', { step: '0.01' }) + '<div class="c2"><label>Notas</label><textarea data-k="Notas"></textarea></div></div>', '<button class="erp-btn" id="faG">Guardar</button>');
  var b = w.el.querySelector('#faG');
  b.onclick = function(){ eGuardar(b, function(){ return erp('saveFactura', leer(w.el)); }).then(function(){ w.cerrar(); ptToast('Factura registrada.'); vFacturas(eq('erpMain')); }, function(){}); };
}
function cobroForm(id){
  var f = E.cache.facts.filter(function(x){ return x.ID === id; })[0];
  var w = ventana('Registrar cobro · ' + esc(f.FolioSAT), '<p class="erp-sub">' + esc(f.Cliente) + ' · Saldo ' + $m(f.Saldo) + '</p><div class="erp-form">' + campo('Monto', 'Monto', f.Saldo, 'number', { step: '0.01' }) + campo('Fecha', 'Fecha', hoyIso(), 'date') + campo('Referencia', 'Referencia', '', 'text', { c2: 1 }) + '</div>', '<button class="erp-btn" id="cbG">Guardar</button>');
  var b = w.el.querySelector('#cbG');
  b.onclick = function(){ var p = leer(w.el); p.FacturaID = id; eGuardar(b, function(){ return erp('registrarCobro', p); }).then(function(){ w.cerrar(); ptToast('Cobro registrado.'); vFacturas(eq('erpMain')); }, function(){}); };
}

/* ===================== USUARIOS DEL ERP ===================== */
function vUsuarios(m){
  erp('usuarios').then(function(rows){
    E.cache.users = rows;
    m.innerHTML = '<h2>Usuarios del ERP</h2><p class="erp-sub">Quién entra al ERP y con qué rol. El rol decide qué módulos ve y qué puede hacer; los socios entran como Dirección (solo lectura).</p>' +
      '<div class="erp-bar"><span class="sp"></span><button class="erp-btn nar" type="button" onclick="usrForm()">+ Agregar usuario</button></div>' +
      '<div class="erp-scroll"><table class="erp-tabla"><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Activo</th><th>Prefijo cot.</th></tr></thead><tbody>' +
      rows.map(function(u){ return '<tr class="clic" onclick="usrForm(\'' + esc(u.Email) + '\')"><td>' + esc(u.Email) + '</td><td>' + esc(u.Nombre) + '</td><td>' + esc(u.Rol) + '</td><td>' + esc(u.Activo) + '</td><td>' + esc(u.PrefijoCot) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="erp-card" style="margin-top:16px"><h3>Roles</h3><p class="erp-sub" style="margin:0">ADMIN: todo · COMERCIAL: sus clientes, cotizaciones y ODP · PRODUCCION: ODP, producción y consumo · ALMACEN: inventario y compras · FINANZAS: facturas, cobros, compras y costos · DIRECCION: consulta total · CONSULTA: consulta sin costos.</p></div>';
  }, function(e){ erpError(m, e); });
}
function usrForm(email){
  var u = email ? E.cache.users.filter(function(x){ return x.Email === email; })[0] : {};
  var w = ventana(email ? 'Usuario' : 'Agregar usuario', '<div class="erp-form">' + campo('Email', 'Correo', u.Email, 'email', { c2: 1 }) + campo('Nombre', 'Nombre', u.Nombre) + selCampo('Rol', 'Rol', E.init.cat.ROLES, u.Rol || 'COMERCIAL', false) +
    selCampo('Activo', 'Activo', ['SI', 'NO'], u.Activo || 'SI', false) + campo('PrefijoCot', 'Prefijo de cotización (ej. CP)', u.PrefijoCot) + '</div>', '<button class="erp-btn" id="usG">Guardar</button>');
  if (email) { w.el.querySelector('[data-k=Email]').disabled = true; }
  var b = w.el.querySelector('#usG');
  b.onclick = function(){ var p = leer(w.el); if (email) { p.Email = email; } eGuardar(b, function(){ return erp('saveUsuario', p); }).then(function(){ w.cerrar(); ptToast('Usuario guardado.'); vUsuarios(eq('erpMain')); }, function(){}); };
}
</script>
