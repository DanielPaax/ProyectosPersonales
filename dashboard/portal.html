<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intranet BIG FOOT print</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Colores corporativos: se cambian aqui y solo aqui. */
:root{
  --navy:#18303C; --navy-l:#2B4A5A;
  --teal:#0093AE; --teal-d:#00768C; --teal-l:#E6F4F7;
  --ambar:#F0A80C; --ambar-l:#FFF4DC;
  --tinta:#18303C; --tinta-2:#5C6F7A; --tinta-3:#91A1AA;
  --linea:#DDE5E9; --fondo:#F4F7F9; --blanco:#fff; --rojo:#C0392B;
  --r:16px; --sombra:0 1px 3px rgba(24,48,60,.07),0 1px 2px rgba(24,48,60,.05);
  --sombra-h:0 14px 34px rgba(24,48,60,.14),0 3px 8px rgba(24,48,60,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Montserrat',-apple-system,'Segoe UI',Arial,sans-serif; color:var(--tinta); background:var(--fondo);
  min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 420px at 92% -8%, rgba(0,147,174,.13), transparent 62%),
    radial-gradient(700px 380px at -6% 8%, rgba(240,168,12,.10), transparent 60%);
  background-repeat:no-repeat;
}
.franja{height:5px; background:linear-gradient(90deg,var(--navy) 0 38%,var(--teal) 38% 82%,var(--ambar) 82%)}
.top{display:flex; justify-content:flex-end; align-items:center; padding:14px 28px 0; min-height:48px}
.quien{font-size:12px; color:var(--tinta-2); text-align:right; line-height:1.35}
.quien b{display:block; color:var(--tinta); font-weight:600; font-size:12.5px}
.wrap{max-width:1120px; width:100%; margin:0 auto; padding:10px 28px 40px; flex:1}

/* ---- encabezado: logotipo a la izquierda, titulo a su lado ---- */
.hero{display:flex; align-items:center; gap:30px; padding:22px 0 8px}
.logo{flex:0 0 auto; display:flex; align-items:center}
.logo img{display:block; max-height:74px; max-width:240px; width:auto; height:auto}
.marca-txt{font-weight:800; font-size:31px; letter-spacing:.04em; color:var(--navy); line-height:1}
.marca-txt small{display:block; font-size:15px; font-weight:600; letter-spacing:.34em; color:var(--teal); margin-top:5px; text-transform:lowercase}
.vr{width:2px; align-self:stretch; background:linear-gradient(var(--teal),var(--ambar)); border-radius:2px; min-height:64px}
.titulos h1{margin:0; font-size:36px; font-weight:700; letter-spacing:-.02em; color:var(--navy); line-height:1.12}
.titulos p{margin:9px 0 0; font-size:13px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--teal-d)}

/* ---- recuadros de area ---- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:22px; margin-top:34px}
.tile{
  position:relative; text-align:left; font:inherit; color:inherit; text-decoration:none; cursor:pointer;
  background:var(--blanco); border:1px solid var(--linea); border-radius:var(--r); padding:26px 24px 20px;
  display:flex; flex-direction:column; gap:12px; min-height:208px; box-shadow:var(--sombra); overflow:hidden;
  transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.tile::before{content:""; position:absolute; left:0; top:0; right:0; height:4px;
  background:linear-gradient(90deg,var(--teal),var(--ambar)); transform:scaleX(0); transform-origin:left; transition:transform .3s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-5px); box-shadow:var(--sombra-h); border-color:#C6D6DD; outline:none}
.tile:hover::before,.tile:focus-visible::before{transform:scaleX(1)}
.tile:focus-visible{box-shadow:0 0 0 3px rgba(0,147,174,.35), var(--sombra-h)}
.ico{width:54px; height:54px; border-radius:14px; display:grid; place-items:center; color:#fff;
  background:linear-gradient(135deg,var(--navy) 0%,var(--teal) 100%); box-shadow:0 6px 14px rgba(0,147,174,.28)}
.ico svg{width:28px; height:28px; stroke:#fff; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tile h2{margin:6px 0 0; font-size:19px; font-weight:700; letter-spacing:-.01em}
.tile p{margin:0; font-size:13px; line-height:1.5; color:var(--tinta-2); flex:1}
.ir{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-d)}
.ir svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s}
.tile:hover .ir svg{transform:translateX(5px)}
.tile.cerrado{cursor:not-allowed; background:#F8FAFB}
.tile.cerrado .ico{background:linear-gradient(135deg,#9FB0B9,#BCC8CE); box-shadow:none}
.tile.cerrado h2,.tile.cerrado p{color:var(--tinta-3)}
.tile.cerrado .ir{color:var(--tinta-3)}
.tile.cerrado:hover{transform:none; box-shadow:var(--sombra); border-color:var(--linea)}
.tile.cerrado:hover::before{transform:scaleX(0)}

/* ---- vista de area ---- */
.av{margin-top:18px}
.migas{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--tinta-2); font-weight:500}
.migas button{font:inherit; background:none; border:none; color:var(--teal-d); font-weight:700; cursor:pointer; padding:4px 2px}
.migas button:hover{text-decoration:underline}
.av-cab{display:flex; align-items:center; gap:20px; margin:18px 0 6px}
.av-cab .ico{width:62px; height:62px; border-radius:16px}
.av-cab .ico svg{width:32px; height:32px}
.av-cab h2{margin:0; font-size:28px; font-weight:700; letter-spacing:-.02em}
.av-cab p{margin:5px 0 0; color:var(--tinta-2); font-size:14px}
.bloque{margin-top:30px}
.bloque>h3{margin:0 0 14px; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--tinta-2);
  display:flex; align-items:center; gap:10px}
.bloque>h3::after{content:""; flex:1; height:1px; background:var(--linea)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px}
.card{background:var(--blanco); border:1px solid var(--linea); border-radius:14px; padding:18px 18px 16px; box-shadow:var(--sombra);
  display:flex; flex-direction:column; gap:7px; text-decoration:none; color:inherit; position:relative;
  transition:transform .18s, box-shadow .18s, border-color .18s}
a.card:hover{transform:translateY(-3px); box-shadow:var(--sombra-h); border-color:#C6D6DD}
.card h4{margin:0; font-size:15px; font-weight:700; padding-right:92px}
.card p{margin:0; font-size:12.5px; color:var(--tinta-2); line-height:1.5}
.card.prox{background:#FAFBFC; border-style:dashed}
.card.prox h4{color:var(--tinta-2)}
.badge{position:absolute; top:14px; right:14px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  padding:3px 9px; border-radius:20px; background:var(--ambar-l); color:#8A5B00}
.badge.ok{background:var(--teal-l); color:var(--teal-d)}
.enlace svg{width:16px; height:16px; stroke:var(--teal-d); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; position:absolute; top:18px; right:16px}
.enlace h4{padding-right:26px}
.vacio{background:var(--blanco); border:1.5px dashed #C6D6DD; border-radius:var(--r); padding:46px 28px; text-align:center; color:var(--tinta-2)}
.vacio .ico{margin:0 auto 16px; opacity:.9}
.vacio h4{margin:0 0 6px; font-size:17px; color:var(--tinta)}
.vacio p{margin:0 auto; max-width:520px; font-size:13.5px; line-height:1.6}
.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px}
.chip{font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:20px; background:#EEF2F4; color:var(--tinta-2)}
.nota{font-size:12px; color:var(--tinta-3); margin-top:10px}

.estado{padding:60px 20px; text-align:center; color:var(--tinta-2); font-size:14px}
.spin{width:30px; height:30px; border:3px solid var(--linea); border-top-color:var(--teal); border-radius:50%; margin:0 auto 14px; animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.err{background:#FDECEA; color:#7A1F14; border:1px solid #F3C6C0; border-radius:12px; padding:18px 20px; font-size:13.5px; line-height:1.55; margin-top:30px}
.err b{display:block; margin-bottom:4px; font-size:14.5px}
footer{padding:20px 28px 26px; text-align:center; font-size:11.5px; color:var(--tinta-3)}
#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff;
  padding:12px 20px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s; z-index:50; max-width:90vw; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.oculto{display:none !important}
@media (max-width:680px){
  .wrap{padding:6px 16px 30px}
  .top{padding:12px 16px 0}
  .hero{flex-direction:column; align-items:flex-start; gap:16px}
  .vr{width:64px; height:3px; min-height:3px; align-self:auto}
  .titulos h1{font-size:28px}
  .tiles{gap:14px; margin-top:24px}
  .av-cab h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>
<div class="franja"></div>
<div class="top"><div class="quien" id="quien"></div></div>

<main class="wrap">
  <section class="hero" id="hero">
    <div class="logo" id="logo"></div>
    <div class="vr" aria-hidden="true"></div>
    <div class="titulos">
      <h1>Bienvenido a la Intranet</h1>
      <p>Selecciona el área</p>
    </div>
  </section>

  <div id="inicio">
    <div class="estado" id="cargando"><div class="spin"></div>Cargando tu intranet…</div>
    <div class="tiles oculto" id="tiles"></div>
  </div>

  <section class="av oculto" id="vistaArea" aria-live="polite"></section>
  <div id="falla"></div>
</main>

<footer>Intranet <?= sello.nombre.replace('TABLERO ', '') ?> · v<?= sello.version ?></footer>
<div id="toast" role="status"></div>

<script>
var CLAVE = <?!= clave ?>;
var URL_DASH = <?!= JSON.stringify(urlDashboard) ?>;
var LOGO = <?!= logo ?>;
var INFO = null;

var ICONOS = {
  grafica: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  brujula: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  personas: '<circle cx="9" cy="8" r="3.4"/><path d="M2.6 20c.4-3.6 3-5.6 6.4-5.6s6 2 6.4 5.6"/><path d="M16 4.8a3.3 3.3 0 010 6.4M18.4 14.9c1.9.7 3.1 2.3 3.4 5.1"/>',
  engrane: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M18.5 5.5l-1.9 1.9M7.4 16.6l-1.9 1.9"/>',
  negocio: '<rect x="3" y="7.5" width="18" height="12.5" rx="2.2"/><path d="M8.5 7.5V5.6A1.6 1.6 0 0110.1 4h3.8a1.6 1.6 0 011.6 1.6v1.9M3 13h18"/>',
  candado: '<rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  flecha: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  externo: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',
  obra: '<path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/>'
};
function svg(n){ return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONOS[n] || ICONOS.obra) + '</svg>'; }
function esc(t){ return String(t === null || t === undefined ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function toast(m){ var t = $('toast'); t.textContent = m; t.className = 'on'; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.className = ''; }, 3600); }

/* logotipo (imagen incrustada) o, mientras no haya, el nombre escrito */
(function(){
  $('logo').innerHTML = LOGO
    ? '<img src="' + esc(LOGO) + '" alt="BIG FOOT print">'
    : '<div class="marca-txt">BIG FOOT<small>print</small></div>';
})();

var ROL = { MASTER: 'Administrador', CAPTURA: 'Captura', SOCIO: 'Socio', LECTOR: 'Colaborador' };

function pintaInicio(info){
  INFO = info;
  $('quien').innerHTML = '<b>' + esc(info.ses.correo) + '</b>' + esc(ROL[info.ses.rol] || info.ses.rol);
  var h = '';
  info.areas.forEach(function(a){
    var cuerpo = '<div class="ico">' + svg(a.icono) + '</div><h2>' + esc(a.nombre) + '</h2><p>' + esc(a.desc) + '</p>' +
      (a.acceso ? '<div class="ir">Entrar ' + svg('flecha') + '</div>'
                : '<div class="ir">' + svg('candado') + ' Acceso restringido</div>');
    if (a.acceso && a.pagina) {
      h += '<a class="tile" href="' + esc(URL_DASH || '#') + '" target="_top" aria-label="Entrar a ' + esc(a.nombre) + '">' + cuerpo + '</a>';
    } else if (a.acceso) {
      h += '<button type="button" class="tile" onclick="abrirArea(\'' + a.id + '\')" aria-label="Entrar a ' + esc(a.nombre) + '">' + cuerpo + '</button>';
    } else {
      h += '<button type="button" class="tile cerrado" onclick="sinAcceso(\'' + esc(a.nombre) + '\')" aria-label="' + esc(a.nombre) + ': acceso restringido">' + cuerpo + '</button>';
    }
  });
  $('tiles').innerHTML = h;
  $('cargando').className = 'oculto';
  $('tiles').className = 'tiles';
}
function sinAcceso(n){ toast('No tienes acceso a ' + n + '. Si lo necesitas, solicítalo a la administración.'); }

function falla(err){
  var m = (err && err.message) ? err.message : 'Error desconocido';
  $('cargando').className = 'oculto';
  $('falla').innerHTML = '<div class="err"><b>No se pudo cargar la intranet.</b>' + esc(m) + '</div>';
}

function volverInicio(){
  $('vistaArea').className = 'av oculto';
  $('inicio').className = '';
  $('hero').className = 'hero';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function abrirArea(id){
  $('inicio').className = 'oculto';
  $('hero').className = 'hero oculto';
  var v = $('vistaArea');
  v.className = 'av';
  v.innerHTML = '<div class="estado"><div class="spin"></div>Abriendo el área…</div>';
  window.scrollTo({ top: 0 });
  google.script.run
    .withSuccessHandler(pintaArea)
    .withFailureHandler(function(err){
      var m = (err && err.message) ? err.message : 'Error desconocido';
      v.innerHTML = migas('') + '<div class="err"><b>No se pudo abrir el área.</b>' + esc(m) + '</div>';
    })
    .portalArea(id, CLAVE);
}

function migas(nombre){
  return '<div class="migas"><button type="button" onclick="volverInicio()">‹ Inicio</button>' +
         (nombre ? '<span>/</span><span>' + esc(nombre) + '</span>' : '') + '</div>';
}

function pintaArea(a){
  var h = migas(a.nombre) +
    '<div class="av-cab"><div class="ico">' + svg(a.icono) + '</div><div><h2>' + esc(a.nombre) + '</h2><p>' + esc(a.desc) + '</p></div></div>';
  var hay = false;

  if (a.modulos && a.modulos.length) {
    hay = true;
    h += '<div class="bloque"><h3>Módulos</h3><div class="cards">';
    a.modulos.forEach(function(m){
      if (m.estado === 'activo' && m.destino === 'dashboard') {
        h += '<a class="card" href="' + esc(URL_DASH || '#') + '" target="_top"><span class="badge ok">Disponible</span><h4>' + esc(m.nombre) + '</h4><p>' + esc(m.desc) + '</p></a>';
      } else {
        h += '<div class="card prox"><span class="badge">Próximamente</span><h4>' + esc(m.nombre) + '</h4><p>' + esc(m.desc) + '</p></div>';
      }
    });
    h += '</div></div>';
  }

  if (a.enlaces && a.enlaces.length) {
    hay = true;
    var por = {}, orden = [];
    a.enlaces.forEach(function(e){ if (!por[e.categoria]) { por[e.categoria] = []; orden.push(e.categoria); } por[e.categoria].push(e); });
    orden.forEach(function(cat){
      h += '<div class="bloque"><h3>' + esc(cat) + '</h3><div class="cards">';
      por[cat].forEach(function(e){
        h += '<a class="card enlace" href="' + esc(e.url) + '" target="_blank" rel="noopener noreferrer">' + svg('externo') +
             '<h4>' + esc(e.titulo) + '</h4>' + (e.descripcion ? '<p>' + esc(e.descripcion) + '</p>' : '') + '</a>';
      });
      h += '</div></div>';
    });
  }

  if (!hay) {
    var esAdmin = INFO && INFO.ses.rol === 'MASTER';
    h += '<div class="bloque"><div class="vacio"><div class="ico">' + svg(a.icono) + '</div>';
    if (a.id === 'talento') {
      h += '<h4>Aún no hay enlaces publicados</h4><p>' + (esAdmin
        ? 'Agrega solicitudes y documentos en la hoja <b>ENLACES</b> del Sheet: AREA = <b>talento</b>, una CATEGORIA, un TITULO y la URL. Aparecen aquí sin tocar el código.'
        : 'Pronto encontrarás aquí las solicitudes y los documentos de consulta de políticas.') + '</p>';
    } else {
      h += '<h4>Esta área está en construcción</h4><p>La estructura ya está lista; los módulos se irán agregando aquí.</p>';
    }
    if (a.planeados && a.planeados.length) {
      h += '<div class="chips" aria-label="Módulos planeados">' + a.planeados.map(function(p){ return '<span class="chip">' + esc(p) + '</span>'; }).join('') + '</div>';
    }
    h += '</div></div>';
  }
  $('vistaArea').innerHTML = h;
  window.scrollTo({ top: 0 });
}

google.script.run.withSuccessHandler(pintaInicio).withFailureHandler(falla).portalInicio(CLAVE);
</script>
</body>
</html>
